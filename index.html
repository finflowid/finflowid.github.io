<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4F46E5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FinFlow">
<meta name="description" content="Catatan keuangan pribadi untuk mahasiswa dan keluarga: pemasukan, pengeluaran, budget, target tabungan, utang-piutang. Bisa dipakai offline.">
<title>FinFlow</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%234F46E5'/%3E%3Ctext x='32' y='45' font-size='38' font-family='Arial' font-weight='bold' fill='white' text-anchor='middle'%3EF%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F5FA; --card:#FFFFFF; --card2:#F1F4F9; --text:#0F172A; --muted:#64748B; --line:#E2E8F0;
  --pri:#4F46E5; --pri2:#7C3AED; --pri-soft:#EEF2FF; --pri-text:#4338CA; --acc3:#0D9488;
  --green:#059669; --green-soft:#E7F8F1; --red:#E11D48; --red-soft:#FFF0F3; --amber:#B45309; --amber-soft:#FFF7E6;
  --shadow:0 1px 2px rgba(15,23,42,.04),0 6px 20px rgba(15,23,42,.06);
  --radius:18px; --nav-h:70px;
  color-scheme:light;
}
:root[data-ff="light"]{
  --bg:#F3F5FA; --card:#FFFFFF; --card2:#F1F4F9; --text:#0F172A; --muted:#64748B; --line:#E2E8F0;
  --pri:#4F46E5; --pri2:#7C3AED; --pri-soft:#EEF2FF; --pri-text:#4338CA; --acc3:#0D9488;
  --green:#059669; --green-soft:#E7F8F1; --red:#E11D48; --red-soft:#FFF0F3; --amber:#B45309; --amber-soft:#FFF7E6;
  --shadow:0 1px 2px rgba(15,23,42,.04),0 6px 20px rgba(15,23,42,.06);
  --radius:18px; --nav-h:70px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]):not([data-ff="light"]){
  --bg:#0A0F1E; --card:#131A2D; --card2:#1A2238; --text:#E8EBF7; --muted:#97A2C0; --line:#25304C;
  --pri:#6366F1; --pri2:#8B5CF6; --pri-soft:#1D2150; --pri-text:#A5B4FC; --acc3:#0D9488;
  --green:#34D399; --green-soft:#0D2A21; --red:#FB7185; --red-soft:#341521; --amber:#FBBF24; --amber-soft:#2E2410;
  --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]:not([data-ff="light"]){
  --bg:#0A0F1E; --card:#131A2D; --card2:#1A2238; --text:#E8EBF7; --muted:#97A2C0; --line:#25304C;
  --pri:#6366F1; --pri2:#8B5CF6; --pri-soft:#1D2150; --pri-text:#A5B4FC; --acc3:#0D9488;
  --green:#34D399; --green-soft:#0D2A21; --red:#FB7185; --red-soft:#341521; --amber:#FBBF24; --amber-soft:#2E2410;
  --shadow:none; color-scheme:dark;
}
:root[data-ff="dark"]{
  --bg:#0A0F1E; --card:#131A2D; --card2:#1A2238; --text:#E8EBF7; --muted:#97A2C0; --line:#25304C;
  --pri:#6366F1; --pri2:#8B5CF6; --pri-soft:#1D2150; --pri-text:#A5B4FC; --acc3:#0D9488;
  --green:#34D399; --green-soft:#0D2A21; --red:#FB7185; --red-soft:#341521; --amber:#FBBF24; --amber-soft:#2E2410;
  --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow-x:hidden;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{font:inherit;color:inherit}
a{color:var(--pri-text)}
.hidden{display:none!important}
.muted{color:var(--muted)}
.small{font-size:13px}
.tiny{font-size:12px}
.b{font-weight:700}
.xb{font-weight:800}
.green{color:var(--green)} .red{color:var(--red)} .amber{color:var(--amber)} .pri{color:var(--pri-text)}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrap-row{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stack>*+*{margin-top:12px}
.ellipsis{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.center{text-align:center}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}

/* ---------- layout ---------- */
.wrap{max-width:480px;margin:0 auto;padding:6px 16px calc(var(--nav-h) + 34px + env(safe-area-inset-bottom))}
.top{max-width:480px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 16px 6px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.hello{font-size:17px;font-weight:800;letter-spacing:-.01em}
.top-actions{display:flex;gap:8px;align-items:center}
.icon-btn{width:40px;height:40px;border-radius:14px;background:var(--card);box-shadow:var(--shadow);border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;position:relative;color:var(--text)}
.icon-btn svg{width:20px;height:20px}
.avatar{width:40px;height:40px;border-radius:14px;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;font-weight:800;display:inline-flex;align-items:center;justify-content:center;font-size:16px}
.sync-dot{position:absolute;top:7px;right:7px;width:8px;height:8px;border-radius:50%;background:var(--muted);border:2px solid var(--card)}
[data-sync=ok] .sync-dot{background:var(--green)}
[data-sync=pending] .sync-dot{background:var(--amber)}
[data-sync=error] .sync-dot{background:var(--red)}
[data-sync=syncing] svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.banner{max-width:480px;margin:4px auto 0;padding:0 16px}
.banner>div{background:var(--amber-soft);color:var(--amber);border-radius:14px;padding:10px 12px;font-size:13px;font-weight:600;display:flex;gap:10px;align-items:center;justify-content:space-between}

/* ---------- cards ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px}
.card+.card,.card+.sec,.sec+.card{margin-top:12px}
.sec{margin-top:16px}
.sec-h{display:flex;align-items:center;justify-content:space-between;margin:0 2px 8px}
.sec-h h2{font-size:15px;margin:0;font-weight:800}
.sec-h .link{font-size:13px}
.link{color:var(--pri-text);font-weight:700}
.hero{background:linear-gradient(135deg,var(--pri) 0%,var(--pri2) 55%,var(--acc3,#0D9488) 100%);color:#fff;border-radius:24px;padding:18px;box-shadow:0 12px 30px -10px rgba(79,70,229,.55)}
.hero .lbl{font-size:12px;text-transform:uppercase;letter-spacing:.06em;opacity:.85;font-weight:700}
.hero .big{font-size:30px;font-weight:800;letter-spacing:-.02em;margin:2px 0 12px;line-height:1.15;word-break:break-all}
.hero .mini{background:rgba(255,255,255,.14);border-radius:14px;padding:10px}
.hero .mini .t{font-size:12px;opacity:.9;font-weight:600}
.hero .mini .v{font-weight:800;font-size:15px;margin-top:2px}
.hero .foot{margin-top:10px;font-size:12px;opacity:.9;display:flex;justify-content:space-between;gap:8px}

.wallets{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 6px;margin:0 -2px;scrollbar-width:none}
.wallets::-webkit-scrollbar,.scroll::-webkit-scrollbar{display:none}
.wcard{flex:0 0 auto;min-width:128px;max-width:170px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:left;box-shadow:var(--shadow)}
.wcard .n{font-size:13px;color:var(--muted);font-weight:600}
.wcard .v{font-weight:800;margin-top:4px;font-size:15px}
.wcard.add{display:flex;flex-direction:column;justify-content:center;align-items:center;color:var(--pri-text);font-weight:700;font-size:13px;min-width:96px;border-style:dashed;box-shadow:none}

.qa{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);font-weight:700;font-size:13px}
.qa .ic{width:40px;height:40px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800}
.ic-red{background:var(--red-soft);color:var(--red)} .ic-green{background:var(--green-soft);color:var(--green)} .ic-pri{background:var(--pri-soft);color:var(--pri-text)}

/* ---------- inputs ---------- */
.field{display:block}
.field>span,.lbl2{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:0 0 6px}
.input,select.input,textarea.input{width:100%;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--card2);font-size:16px;font-weight:600;outline:none;min-height:46px}
.input:focus{border-color:var(--pri);background:var(--card)}
.amount-box{display:flex;align-items:center;gap:8px;border:2px solid var(--line);background:var(--card2);border-radius:18px;padding:6px 14px}
.amount-box:focus-within{border-color:var(--pri);background:var(--card)}
.amount-box span{font-weight:800;color:var(--muted);font-size:20px}
.amount-box input{flex:1;min-width:0;border:0;background:transparent;font-size:28px;font-weight:800;outline:none;padding:6px 0}
.hint{font-size:12px;color:var(--muted);margin-top:6px}
.hint.warn{color:var(--amber);font-weight:700}
.hint.bad{color:var(--red);font-weight:700}
.check{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600}
.check input{width:20px;height:20px;accent-color:var(--pri)}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 16px;border-radius:14px;font-weight:800;font-size:15px;background:var(--card2);color:var(--text);border:1px solid var(--line);text-decoration:none}
.btn.pri{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;border:0;box-shadow:0 8px 20px -8px rgba(79,70,229,.6)}
.btn.danger{background:var(--red-soft);color:var(--red);border-color:transparent}
.btn.soft{background:var(--pri-soft);color:var(--pri-text);border-color:transparent}
.btn.green{background:var(--green-soft);color:var(--green);border-color:transparent}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px;border-radius:12px}
.btn.block{width:100%}
.btn:active,.qa:active,.wcard:active,.tx:active,.chip:active{transform:scale(.97)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-weight:700;font-size:13px;white-space:nowrap}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:4px;background:var(--card2);border-radius:14px;border:1px solid var(--line)}
.seg button{padding:9px 6px;border-radius:11px;font-weight:700;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--text);box-shadow:var(--shadow)}
.seg.t-expense button.on{background:var(--red);color:#fff}
.seg.t-income button.on{background:var(--green);color:#fff}
.seg.t-transfer button.on{background:var(--pri);color:#fff}

/* category grid */
.cat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cat-btn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:14px;border:1.5px solid var(--line);background:var(--card2);font-size:11.5px;font-weight:700;line-height:1.2;text-align:center;min-height:72px}
.cat-btn .e{font-size:22px}
.cat-btn.on{border-color:var(--pri);background:var(--pri-soft);color:var(--pri-text)}
.emoji-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.emoji-grid button{font-size:22px;padding:6px 0;border-radius:10px;border:1.5px solid transparent}
.emoji-grid button.on{border-color:var(--pri);background:var(--pri-soft)}

/* ---------- lists ---------- */
.tx{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 4px;border-radius:14px}
.tx+.tx{border-top:1px solid var(--line);border-top-left-radius:0;border-top-right-radius:0}
.tx-ic{width:42px;height:42px;flex:0 0 42px;border-radius:14px;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:20px}
.tx-main{flex:1;min-width:0;display:flex;flex-direction:column}
.tx-title{font-weight:700;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-sub{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-amt{font-weight:800;font-size:14.5px;white-space:nowrap}
.day-h{display:flex;justify-content:space-between;font-size:12.5px;font-weight:700;color:var(--muted);padding:12px 4px 2px}
.empty{text-align:center;color:var(--muted);padding:22px 10px;font-size:14px}
.empty .e{font-size:34px;display:block;margin-bottom:6px}
.item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px;border-radius:16px;background:var(--card2);border:1px solid var(--line)}
.item+.item{margin-top:8px}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:800;background:var(--card2);color:var(--muted)}
.badge.green{background:var(--green-soft);color:var(--green)}
.badge.red{background:var(--red-soft);color:var(--red)}
.badge.amber{background:var(--amber-soft);color:var(--amber)}
.badge.pri{background:var(--pri-soft);color:var(--pri-text)}
.bar{height:9px;border-radius:99px;background:var(--card2);overflow:hidden;border:1px solid var(--line)}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--green)}
.bar>i.amber{background:#F59E0B}.bar>i.red{background:var(--red)}.bar>i.pri{background:linear-gradient(90deg,var(--pri),var(--pri2))}
.stat{background:var(--card2);border-radius:14px;padding:10px 12px;border:1px solid var(--line)}
.stat .t{font-size:12px;color:var(--muted);font-weight:700}
.stat .v{font-weight:800;margin-top:2px;font-size:15px;word-break:break-all}

/* period */
.period{margin:6px 0 12px}
.period-nav{display:flex;align-items:center;justify-content:space-between;margin-top:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px}
.period-nav b{font-size:14px}
.period-nav button{width:38px;height:34px;border-radius:10px;font-size:20px;font-weight:800;color:var(--pri-text)}
.period-nav .dates{display:flex;gap:6px;flex:1}
.period-nav .dates input{flex:1;min-width:0;padding:6px 8px;border-radius:10px;border:1px solid var(--line);background:var(--card2);font-size:16px}

/* charts */
.donut-wrap{display:flex;justify-content:center;padding:4px 0}
.donut{width:180px;height:180px}
.d-lbl{font-size:10px;fill:var(--muted);font-weight:700}
.d-val{font-size:17px;fill:var(--text);font-weight:800}
.legend-row{display:flex;align-items:center;gap:10px;padding:8px 4px;width:100%;text-align:left}
.legend-row+.legend-row{border-top:1px solid var(--line)}
.sw{width:12px;height:12px;border-radius:4px;flex:0 0 12px}
.trend{width:100%;height:auto;display:block}
.trend text{font-size:10px;fill:var(--muted);font-weight:700}
.insight{display:flex;gap:10px;padding:10px 4px;font-size:14px}
.insight+.insight{border-top:1px solid var(--line)}
.insight .e{font-size:18px}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav-in{max-width:480px;margin:0 auto;height:var(--nav-h);display:grid;grid-template-columns:repeat(5,1fr);align-items:center}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:700;color:var(--muted);padding:6px 0}
.nav button svg{width:22px;height:22px}
.nav button.on{color:var(--pri-text)}
.nav .fab{width:58px;height:58px;border-radius:20px;margin:-26px auto 0;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff!important;font-size:30px;font-weight:600;display:flex!important;align-items:center;justify-content:center;box-shadow:0 12px 24px -8px rgba(79,70,229,.7)}

/* sheets */
.sheet-bg{position:fixed;inset:0;z-index:60;background:rgba(10,15,30,.55);display:flex;align-items:flex-end;justify-content:center;animation:fade .15s ease}
.sheet{background:var(--card);width:100%;max-width:480px;max-height:92vh;border-radius:24px 24px 0 0;display:flex;flex-direction:column;animation:up .2s ease;padding-bottom:env(safe-area-inset-bottom)}
.sheet-bg.dialog{align-items:center;padding:16px}
.sheet-bg.dialog .sheet{border-radius:22px;max-width:360px}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 16px 10px}
.sheet-h h3{margin:0;font-size:17px;font-weight:800}
.sheet-b{padding:4px 16px 16px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet-f{padding:10px 16px 16px;border-top:1px solid var(--line);display:flex;gap:8px}
.sheet-f .btn{flex:1}
.x-btn{width:36px;height:36px;border-radius:12px;background:var(--card2);font-size:18px;font-weight:700;color:var(--muted)}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (min-width:560px){.sheet-bg{align-items:center;padding:16px}.sheet{border-radius:24px}}

/* toast */
.toast{position:fixed;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translate(-50%,-20px);z-index:100;max-width:92%;width:420px;background:#0F172A;color:#fff;padding:12px 14px;border-radius:16px;font-size:14px;font-weight:700;box-shadow:0 12px 30px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:all .25s ease}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.error{background:#BE123C}.toast.warn{background:#B45309}.toast.success{background:#047857}

/* auth & lock */
.screen{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto}
.auth{max-width:400px;margin:0 auto;padding:calc(28px + env(safe-area-inset-top)) 18px 30px}
.brand{text-align:center;margin-bottom:16px}
.logo{width:62px;height:62px;border-radius:20px;margin:0 auto 10px;background:linear-gradient(135deg,#4F46E5,#7C3AED 55%,#0D9488);color:#fff;font-size:30px;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 12px 30px -10px rgba(79,70,229,.7)}
.brand h1{margin:0;font-size:24px;font-weight:800;letter-spacing:-.02em}
.brand p{margin:4px 0 0;color:var(--muted);font-size:14px}
.feat{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.feat div{font-size:12.5px;font-weight:600;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.lock{max-width:340px;margin:0 auto;padding:calc(40px + env(safe-area-inset-top)) 20px 30px;text-align:center}
.avatar.big{width:72px;height:72px;border-radius:24px;font-size:30px;margin:0 auto 12px}
.dots{display:flex;gap:14px;justify-content:center;margin:22px 0 26px;min-height:16px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--muted)}
.dots i.f{background:var(--pri);border-color:var(--pri)}
.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.keypad button{height:62px;border-radius:20px;background:var(--card);border:1px solid var(--line);font-size:24px;font-weight:700;box-shadow:var(--shadow)}
.keypad button.ok{background:var(--pri);color:#fff;border:0}

/* privacy */
.hide-money .mv{filter:blur(7px);user-select:none}
.receipt-img{width:100%;border-radius:14px;border:1px solid var(--line);display:block}
.thumb{width:56px;height:56px;border-radius:12px;object-fit:cover;border:1px solid var(--line)}
details.guide{background:var(--card2);border-radius:14px;padding:10px 12px;border:1px solid var(--line)}
details.guide summary{font-weight:700;cursor:pointer}
details.guide ol{padding-left:18px;margin:8px 0 0;font-size:13.5px}
details.guide li+li{margin-top:6px}
code{background:var(--card2);padding:1px 5px;border-radius:6px;font-size:12.5px}
.set-group{background:var(--card2);border-radius:16px;border:1px solid var(--line);overflow:hidden}
.set-row{display:flex;align-items:center;gap:12px;width:100%;padding:13px 14px;text-align:left;font-weight:600;font-size:14.5px}
.set-row+.set-row{border-top:1px solid var(--line)}
.set-row .e{font-size:18px;width:24px;text-align:center}
.set-row .chev{color:var(--muted);font-weight:800}
.set-title{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:16px 4px 8px}
.switch{position:relative;width:46px;height:28px;flex:0 0 46px}
.switch input{opacity:0;width:0;height:0;position:absolute}
.switch i{position:absolute;inset:0;border-radius:99px;background:var(--line);transition:.2s}
.switch i:after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch input:checked+i{background:var(--pri)}
.switch input:checked+i:after{transform:translateX(18px)}

/* v6.3 */
.tools{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 4px;margin:0 -2px}
.tools::-webkit-scrollbar{display:none}
.tool{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:4px;width:78px;padding:10px 4px;border-radius:16px;background:var(--card);border:1px solid var(--line);font-size:11.5px;font-weight:700;line-height:1.2;text-align:center;box-shadow:var(--shadow)}
.tool span{font-size:22px}
.tool:active{transform:scale(.97)}
.tip{background:linear-gradient(180deg,var(--pri-soft),var(--card) 70%)}
.tour{text-align:center;padding:6px 4px 2px}
.tour-ic{font-size:56px;line-height:1.1;margin-bottom:8px}
.tour h2{font-size:19px;margin:0 0 8px}
.tour p{margin:0 auto;max-width:300px;line-height:1.55}
.tour-dots{display:flex;gap:6px;justify-content:center;margin-top:16px}
.tour-dots i{width:7px;height:7px;border-radius:99px;background:var(--line)}
.tour-dots i.on{width:20px;background:var(--pri)}
.opt-card{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:14px;margin-top:10px;border-radius:16px;background:var(--card);border:1.5px solid var(--line);line-height:1.45}
.opt-card:active{border-color:var(--pri)}
.opt-card .e{font-size:28px;line-height:1}
.more-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.more-grid .tool{width:auto}
details.faq{border:1px solid var(--line);border-radius:14px;background:var(--card);margin-bottom:8px;overflow:hidden}
details.faq summary{padding:12px 14px;font-weight:700;font-size:14px;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:10px}
details.faq summary::-webkit-details-marker{display:none}
details.faq summary::after{content:'+';color:var(--muted);font-weight:800}
details.faq[open] summary::after{content:'−'}
details.faq p{margin:0;padding:0 14px 14px;font-size:13.5px;line-height:1.6;color:var(--muted)}
@media (max-width:340px){.more-grid{grid-template-columns:repeat(3,1fr)}}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-h{font-size:11px;font-weight:800;color:var(--muted);text-align:center;padding-bottom:2px}
.cal-d{aspect-ratio:1/1.05;max-width:100%;border-radius:10px;background:var(--card2);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:2px;min-width:0}
.cal-d b{font-size:13px}
.cal-d span{font-size:9.5px;font-weight:700;color:var(--muted);white-space:nowrap;overflow:hidden;max-width:100%}
.cal-d.ok{background:var(--green-soft);border-color:transparent}.cal-d.ok span{color:var(--green)}
.cal-d.mid{background:var(--amber-soft);border-color:transparent}.cal-d.mid span{color:var(--amber)}
.cal-d.hi{background:var(--red-soft);border-color:transparent}.cal-d.hi span{color:var(--red)}
.cal-d.fut{opacity:.35}.cal-d.today{outline:2px solid var(--pri);outline-offset:-2px}
.cal-k{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.cal-k.ok{background:var(--green)}.cal-k.mid{background:#F59E0B}.cal-k.hi{background:var(--red)}
.split-list{display:flex;flex-direction:column;gap:8px}
.split-row{display:flex;align-items:center;gap:8px;padding:10px;border-radius:14px;background:var(--card2);border:1px solid var(--line)}
.split-row .input.money{width:130px;flex:0 0 130px}
.split-row .x-btn{flex:0 0 36px}
.ch-dots{display:flex;flex-wrap:wrap;gap:4px}
.ch-dots i{width:12px;height:12px;border-radius:4px;background:var(--line)}
.ch-dots i.y{background:var(--green)}.ch-dots i.n{background:var(--red)}.ch-dots i.p{background:#F59E0B}
.quiz-opt{display:block;width:100%;text-align:left;padding:13px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--card2);font-weight:600}
.quiz-opt.right{border-color:var(--green);background:var(--green-soft);color:var(--green)}
.quiz-opt.wrong{border-color:var(--red);background:var(--red-soft);color:var(--red)}
.quiz-opt:disabled{opacity:1}
.lock-bio{margin-top:14px}
#printArea{display:none}
@media print{
  body{background:#fff}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block;color:#000;font-family:Arial,sans-serif;font-size:11px}
  #printArea table{width:100%;border-collapse:collapse;margin:8px 0 14px}
  #printArea th,#printArea td{border:1px solid #bbb;padding:4px 6px;text-align:left}
  #printArea th{background:#eee}
}

/* ---------------- penyimpanan aman ---------------- */
const memStore = {};
let storageWarned = false;

/* foto struk di IndexedDB (bukan localStorage yang cuma ~5 MB) */
const Receipts = {
  _db: null,
  open() {
    if (this._db) return Promise.resolve(this._db);
    return new Promise((res, rej) => {
      try {
        const r = indexedDB.open('finflow_files', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('receipts');
        r.onsuccess = () => { this._db = r.result; res(this._db); };
        r.onerror = () => rej(r.error || new Error('IndexedDB gagal'));
      } catch (e) { rej(e); }
    });
  },
  async _tx(mode, fn) {
    const db = await this.open();
    return new Promise((res, rej) => {
      const t = db.transaction('receipts', mode); const st = t.objectStore('receipts');
      let out; const req = fn(st); if (req) req.onsuccess = () => { out = req.result; };
      t.oncomplete = () => res(out); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error || new Error('dibatalkan'));

  del(txId, u) { return this._tx('readwrite', st => st.delete(this.key(txId, u))).catch(() => {}); },
  async delUser(u) {
    try { const keys = await this._tx('readonly', st => st.getAllKeys());
      const mine = (keys || []).filter(k => String(k).indexOf(u + ':') === 0);
      if (mine.length) await this._tx('readwrite', st => { mine.forEach(k => st.delete(k)); return null; });
    } catch (e) {}

/* ---------------- utilitas ---------------- */
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function fmtNum(n) { return Math.round(Math.abs(Number(n) || 0)).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.'); }
function rp(n) { const v = Math.round(Number(n) || 0); return (v < 0 ? '-Rp ' : 'Rp ') + fmtNum(v); }
function mv(n, sign) { const v = Math.round(Number(n) || 0); return '<span class="mv">' + (sign || '') + (sign ? 'Rp ' + fmtNum(v) : rp(v)) + '</span>'; }

/* SHA-256 murni JS (tetap jalan walau crypto.subtle tidak tersedia, mis. dibuka dari file://) */
const SHA_K = new Uint32Array([0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2]);
function sha256Hex(str) {
  const bytes = new TextEncoder().encode(String(str));
  const l = bytes.length, total = ((l + 9 + 63) >> 6) << 6;

  const dv = new DataView(buf.buffer); const bits = l * 8;
  dv.setUint32(total - 4, bits >>> 0); dv.setUint32(total - 8, Math.floor(bits / 4294967296));

  const W = new Uint32Array(64);
  for (let off = 0; off < total; off += 64) {
    for (let i = 0; i < 16; i++) W[i] = dv.getUint32(off + i * 4);
    for (let i = 16; i < 64; i++) {
      const a = W[i - 15], b = W[i - 2];

    for (let i = 0; i < 64; i++) {

      const S0 = ((a >>> 2) | (a << 30)) ^ ((a >>> 13) | (a << 19)) ^ ((a >>> 22) | (a << 10));
      const t2 = (S0 + ((a & b) ^ (a & c) ^ (b & c))) >>> 0;
      h = g; g = f; f = e; e = (d + t1) >>> 0; d = c; c = b; b = a; a = (t1 + t2) >>> 0;
    }

    H[4] = (H[4] + e) >>> 0; H[5] = (H[5] + f) >>> 0; H[6] = (H[6] + g) >>> 0; H[7] = (H[7] + h) >>> 0;
  }
  return H.map(x => x.toString(16).padStart(8, '0')).join('');

  const a = new Uint8Array(n);
  try { crypto.getRandomValues(a); } catch (e) { for (let i = 0; i < n; i++) a[i] = Math.floor(Math.random() * 256); }

/* ---------------- tanggal (selalu waktu lokal HP) ---------------- */
const BULAN = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
const BLN = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
const HARI = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
function pad2(n) { return String(n).padStart(2, '0'); }
function ymd(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function parseYmd(s) { const p = String(s || '').split('-').map(Number); return new Date(p[0] || 1970, (p[1] || 1) - 1, p[2] || 1); }
function today() { return ymd(new Date()); }
function addDays(s, n) { const d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); }
function dayDiff(a, b) { const A = parseYmd(a), B = parseYmd(b); return Math.round((Date.UTC(B.getFullYear(), B.getMonth(), B.getDate()) - Date.UTC(A.getFullYear(), A.getMonth(), A.getDate())) / 864e5); }
function isYmd(s) { return /^\d{4}-\d{2}-\d{2}$/.test(String(s || '')) && ymd(parseYmd(s)) === s; }
function fmtDate(s, withDay) { if (!s) return ''; const d = parseYmd(s); return (withDay ? HARI[d.getDay()] + ', ' : '') + d.getDate() + ' ' + BLN[d.getMonth()] + ' ' + d.getFullYear(); }
function fmtDateShort(s) { const d = parseYmd(s); return d.getDate() + ' ' + BLN[d.getMonth()]; }
function relDay(s) { const n = dayDiff(today(), s); if (n === 0) return 'Hari ini'; if (n === -1) return 'Kemarin'; if (n === 1) return 'Besok'; return fmtDate(s, true); }
function addMonthsClamp(s, n, anchorDay) {
  const d = parseYmd(s); const day = anchorDay || d.getDate();
  const t = new Date(d.getFullYear(), d.getMonth() + n, 1);
  const last = new Date(t.getFullYear(), t.getMonth() + 1, 0).getDate();

    case 'saving': return t.walletId ? [[t.walletId, -a]] : [];
    case 'debt': { const sign = (t.role === 'principal') === (t.kind === 'hutang') ? 1 : -1; return t.walletId ? [[t.walletId, sign * a]] : []; }

}

  for (const t of S.db.txs) { if (t.deleted) continue; for (const [w, d] of walletEffects(t)) { if (w in m) m[w] += d; } }
  return m;
}

/* ---------------- periode ---------------- */
function monthRange(offset, base) {
  const sd = Math.min(28, Math.max(1, Number(prefs().monthStartDay) || 1));
  const b = parseYmd(base || today());
  let y = b.getFullYear(), m = b.getMonth();
  if (b.getDate() < sd) m -= 1;
  m += offset || 0;
  const start = new Date(y, m, sd), end = new Date(y, m + 1, sd - 1);
  const label = sd === 1 ? BULAN[start.getMonth()] + ' ' + start.getFullYear()
    : start.getDate() + ' ' + BLN[start.getMonth()] + ' – ' + end.getDate() + ' ' + BLN[end.getMonth()] + ' ' + end.getFullYear();
  return { start: ymd(start), end: ymd(end), label: label, shortLabel: BLN[start.getMonth()] + (sd === 1 ? '' : '*') };
}
function periodRange(p) {
  p = p || S.ui.period; const t = today(); const off = p.offset || 0;
  if (p.kind === 'today') { const d = addDays(t, off); return { start: d, end: d, label: relDay(d) }; }
  if (p.kind === 'week') {
    const dow = parseYmd(t).getDay(); const s = addDays(t, -((dow + 6) % 7) + 7 * off); const e = addDays(s, 6);
    return { start: s, end: e, label: (off === 0 ? 'Minggu ini · ' : '') + fmtDateShort(s) + ' – ' + fmtDateShort(e) };
  }
  if (p.kind === 'month') { const r = monthRange(off); if (off === 0) r.label = r.label + ' (bulan ini)'; return r; }
  if (p.kind === 'year') { const y = parseYmd(t).getFullYear() + off; return { start: y + '-01-01', end: y + '-12-31', label: 'Tahun ' + y }; }
  if (p.kind === 'custom') {
    let s = S.ui.cStart || monthRange(0).start, e = S.ui.cEnd || t; if (s > e) { const x = s; s = e; e = x; }
    return { start: s, end: e, label: fmtDate(s) + ' – ' + fmtDate(e) };
  }
  return { start: '0000-01-01', end: '9999-12-31', label: 'Semua waktu' };
}
function previousRange(p) {
  p = p || S.ui.period;
  if (['today', 'week', 'month', 'year'].indexOf(p.kind) >= 0) return periodRange({ kind: p.kind, offset: (p.offset || 0) - 1 });
  if (p.kind === 'custom') { const r = periodRange(p); const n = dayDiff(r.start, r.end) + 1; return { start: addDays(r.start, -n), end: addDays(r.start, -1) }; }

let lockBuf = '', lockUser = null;
function showLock(u) {
  const rec = getUsers()[u]; if (!rec) return showAuth('login');
  if (!rec.pinNumeric) { S.authMode = 'login'; showAuth('login'); const i = $('#authScreen [name=username]'); if (i) i.value = u; return; }

function drawLockDots() { const rec = getUsers()[lockUser]; const n = rec ? rec.pinLen : 4; const d = $('#lockDots'); if (d) d.innerHTML = Array.from({ length: n }, (_, i) => '<i class="' + (i < lockBuf.length ? 'f' : '') + '"></i>').join(''); }
function lockKey(k) {
  const rec = getUsers()[lockUser]; if (!rec) return;
  if (k === 'del') lockBuf = lockBuf.slice(0, -1);
  else if (k === 'ok') return tryUnlock();
  else if (lockBuf.length < 8) lockBuf += k;
  drawLockDots();
  if (lockBuf.length === rec.pinLen) setTimeout(tryUnlock, 80);
}
function tryUnlock() {
  const u = lockUser; const rec = getUsers()[u]; if (!rec || !lockBuf) return;
  const wait = lockedFor(u); if (wait) { lockBuf = ''; drawLockDots(); return toast('Terlalu banyak percobaan. Tunggu ' + wait + ' detik.', 'error'); }
  if (pinHash(rec.salt, lockBuf) === rec.pinHash) { recordFail(u, true); lockBuf = ''; startSession(u); return; }
  const n = recordFail(u); lockBuf = '';
  const d = $('#lockDots'); if (d) { d.classList.remove('shake'); void d.offsetWidth; d.classList.add('shake'); }
  drawLockDots(); toast('PIN salah' + (n >= 3 ? ' (' + n + 'x percobaan)' : ''), 'error');
}
document.addEventListener('keydown', e => {
  if ($('#lockScreen').classList.contains('hidden')) return;

});

function migrateLegacy() {
  if (LS.get('ff6_migrated')) return;
  const legacy = LS.getJSON('finflow_multi_users', null);
  if (!legacy || typeof legacy !== 'object') { LS.set('ff6_migrated', '1'); return; }
  const users = getUsers(); const done = [];
  const CMAP = { expense: { 'Makan & Minum': 'e_makan', 'Transportasi': 'e_transport', 'Belanja': 'e_belanja', 'Tagihan & Kuota': 'e_tagihan', 'Kebutuhan Kuliah/Kerja': 'e_kuliah', 'Kos / Rumah': 'e_kos', 'Hiburan': 'e_hiburan', 'Kesehatan': 'e_kesehatan', 'Lainnya': 'e_lain' },
    income: { 'Gaji / Upah': 'i_gaji', 'Proyek / Freelance': 'i_proyek', 'Uang Saku / Beasiswa': 'i_saku', 'Bonus': 'i_bonus', 'Investasi': 'i_invest', 'Lainnya': 'i_lain' } };
  const WMAP = { 'Tunai': 'w_tunai', 'Bank': 'w_bank', 'E-Wallet': 'w_ewallet' };

    try {
      const lu = legacy[key] || {}; const u = normUser(lu.username || key); if (!u || users[u] || u === 'demo') return;
      const pin = String(lu.password || '1234');
      const rec = createLocalUser(u, lu.displayName || u, pin); if (!rec.pinNumeric) updateLocalUser(u, { lockOnOpen: false });
      const db = emptyDb(); seedDefaults(db); const ts = Date.now();

      const mk = (o) => Object.assign({ createdAt: ts, updatedAt: ts }, o);
      const catId = (type, name) => {
        const m = CMAP[type][name]; if (m) return m;
        const ex = db.categories.find(c => c.type === type && c.name === name); if (ex) return ex.id;
        const id = uid('c'); db.categories.push(mk({ id: id, type: type, icon: '🏷️', name: String(name || 'Lainnya').slice(0, 30), order: 99 })); return id;
      };

        if (String(x.id).indexOf('tf_out_') === 0) {

          db.txs.push(mk({ id: 't' + x.id, type: 'transfer', amount: Number(x.amount) || 0, walletId: w, toWalletId: to, date: date, note: '' })); return;
        }

        const t = mk({ id: 't' + x.id, type: type, amount: Number(x.amount) || 0, categoryId: catId(type, x.category), walletId: w, date: date, note: String(x.note || '').slice(0, 120) });
        if (x.receiptUrl && String(x.receiptUrl).indexOf('data:image') === 0) { t.hasReceipt = true; Receipts.put(t.id, x.receiptUrl, u).catch(() => { t.hasReceipt = false; }); }
        db.txs.push(t);
      });
      const bud = LS.getJSON('finflow_budgets_' + key, {}) || {};
      Object.keys(bud).forEach(name => { const cid = catId('expense', name); if (Number(bud[name]) > 0) db.budgets.push(mk({ id: 'b_' + cid, categoryId: cid, limit: Number(bud[name]) })); });
      (LS.getJSON('finflow_debts_' + key, []) || []).forEach(d => {
        if (!d || !d.id) return; const id = 'd' + d.id; const kind = d.type === 'hutang' ? 'hutang' : 'piutang';

        if (d.status === 'lunas') db.txs.push(mk({ id: id + '_lunas', type: 'debt', role: 'payment', kind: kind, debtId: id, walletId: '', amount: Number(d.amount) || 0, date: today(), note: 'Lunas (dari versi lama)' }));
      });
      (LS.getJSON('finflow_goals_' + key, []) || []).forEach(g => {
        if (!g || !g.id) return; const id = 'g' + g.id;
        db.goals.push(mk({ id: id, title: g.title || 'Target', icon: '🎯', target: Number(g.target) || 0, deadline: isYmd(g.deadline) ? g.deadline : '' }));

      });

}

function donutSvg(items, total) {
  const R = 54, C = 2 * Math.PI * R; let acc = 0;
  const segs = items.map(it => { const len = total > 0 ? it.v / total * C : 0; const gap = items.length > 1 && len > 4 ? 1.5 : 0;
    const s = '<circle r="' + R + '" cx="70" cy="70" fill="none" stroke="' + it.color + '" stroke-width="18" stroke-dasharray="' + Math.max(0, len - gap).toFixed(2) + ' ' + (C - Math.max(0, len - gap)).toFixed(2) + '" stroke-dashoffset="' + (-acc).toFixed(2) + '" transform="rotate(-90 70 70)"/>'; acc += len; return s; }).join('');
  return '<svg viewBox="0 0 140 140" class="donut" role="img" aria-label="Diagram kategori"><circle r="' + R + '" cx="70" cy="70" fill="none" stroke="var(--card2)" stroke-width="18"/>' + segs +
    '<text x="70" y="64" text-anchor="middle" class="d-lbl">TOTAL</text><text x="70" y="84" text-anchor="middle" class="d-val mv">' + esc(short(total)) + '</text></svg>';
}
function trendSvg(months) {
  const W = 330, H = 170, top = 18, bottom = 24, n = months.length; const max = Math.max(1, ...months.map(m => Math.max(m.inc, m.exp)));
  const gw = W / n; const bw = Math.min(16, gw / 3); let s = '';
  for (let k = 0; k <= 3; k++) { const y = top + (H - top - bottom) * k / 3; s += '<line x1="0" x2="' + W + '" y1="' + y + '" y2="' + y + '" stroke="var(--line)" stroke-width="1"/>'; }
  months.forEach((m, i) => {
    const x = i * gw + gw / 2; const sc = v => (H - top - bottom) * v / max;
    const hi = sc(m.inc), he = sc(m.exp); const base = H - bottom;
    s += '<rect x="' + (x - bw - 2) + '" y="' + (base - hi) + '" width="' + bw + '" height="' + Math.max(hi, 0.5) + '" rx="4" fill="#10B981"/>';
    s += '<rect x="' + (x + 2) + '" y="' + (base - he) + '" width="' + bw + '" height="' + Math.max(he, 0.5) + '" rx="4" fill="#F43F5E"/>';
    s += '<text x="' + x + '" y="' + (H - 7) + '" text-anchor="middle">' + esc(m.label) + '</text>';
    if (m.exp > 0) s += '<text x="' + (x + 2 + bw / 2) + '" y="' + (base - he - 4) + '" text-anchor="middle" class="mv" style="font-size:8.5px">' + esc(short(m.exp)) + '</text>';
  });
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" class="trend" role="img" aria-label="Tren 6 bulan">' + s + '</svg>';
}

function insights(r, sm) {

  if (ex.length && sm.exp > 0) { const c = cat(ex[0][0]); out.push(['🏆', '<b>' + esc(c.name) + '</b> jadi pengeluaran terbesar: ' + Math.round(ex[0][1] / sm.exp * 100) + '% (' + mv(ex[0][1]) + ').']); }
  let pr = previousRange(); let partial = false; const t0 = today();
  /* periode yang sedang berjalan dibandingkan dengan jumlah hari yang sama di periode sebelumnya */
  if (pr && r.start <= t0 && r.end > t0) { const e = addDays(pr.start, dayDiff(r.start, t0)); if (e < pr.end) { pr = { start: pr.start, end: e }; partial = true; } }
  if (pr) { const prev = summarize(pr); if (prev.exp > 0 && sm.exp > 0) { const ch = (sm.exp - prev.exp) / prev.exp * 100;
    out.push([ch > 0 ? '📈' : '📉', 'Pengeluaran ' + (ch > 0 ? '<b class="red">naik ' : '<b class="green">turun ') + Math.abs(Math.round(ch)) + '%</b> dibanding ' + (partial ? 'periode sebelumnya di hari yang sama (' + esc(fmtDateShort(pr.start)) + '–' + esc(fmtDateShort(pr.end)) + ', ' : 'periode sebelumnya (') + mv(prev.exp) + ').']); } }
  if (sm.inc > 0) { const rate = (sm.inc - sm.exp) / sm.inc * 100;
    out.push(rate >= 0 ? ['🐷', 'Kamu menyisakan <b>' + Math.round(rate) + '%</b> dari pemasukan. ' + (rate >= 20 ? 'Mantap, pertahankan!' : 'Target sehat: sisihkan minimal 20%.')] : ['⚠️', 'Pengeluaran melebihi pemasukan sebesar <b class="red">' + mv(sm.exp - sm.inc) + '</b>.']); }
  const big = sm.list.filter(t => t.type === 'expense').sort((a, b) => b.amount - a.amount)[0];
  if (big) out.push(['💸', 'Transaksi terbesar: ' + mv(big.amount) + ' untuk ' + esc(big.note || cat(big.categoryId).name) + ' (' + esc(fmtDateShort(big.date)) + ').']);
  const dow = [0, 0, 0, 0, 0, 0, 0]; sm.list.forEach(t => { if (t.type === 'expense') dow[parseYmd(t.date).getDay()] += +t.amount; });
  const mx = Math.max(...dow); if (mx > 0 && sm.list.length >= 7) out.push(['📅', 'Hari paling boros: <b>' + HARI[dow.indexOf(mx)] + '</b>.']);

}

  if (!(T.amount > 0)) return toast('Isi nominal lebih dari Rp 0', 'error');
  if (!isYmd(T.date)) return toast('Tanggal tidak valid', 'error');
  if (!live('wallets', T.walletId)) return toast('Pilih dompet', 'error');
  const btn = $('[data-act=txSave]', txEntry.el); busy(btn, true, 'Menyimpan…');
  try {
    const isNew = !T.id; const id = T.id || uid('t'); const note = T.note.trim().slice(0, 120);
    let rec;
    if (T.type === 'transfer') {
      if (!live('wallets', T.toWalletId)) { busy(btn, false); return toast('Pilih dompet tujuan', 'error'); }
      if (T.toWalletId === T.walletId) { busy(btn, false); return toast('Dompet asal dan tujuan tidak boleh sama', 'error'); }
      rec = put('txs', { id: id, type: 'transfer', amount: T.amount, walletId: T.walletId, toWalletId: T.toWalletId, fee: T.fee || 0, categoryId: '', date: T.date, note: note, hasReceipt: false });
      const feeId = id + '_fee';
      if (T.fee > 0) put('txs', { id: feeId, type: 'expense', amount: T.fee, categoryId: adminCatId(), walletId: T.walletId, date: T.date, note: 'Biaya admin transfer', transferId: id });
      else del('txs', feeId);
      if (T.hasReceipt) Receipts.del(id);
    } else {
      if (!live('categories', T.categoryId)) { busy(btn, false); return toast('Pilih kategori', 'error'); }
      let hasReceipt = T.hasReceipt && !T.removeReceipt;
      if (T.receipt) { try { await Receipts.put(id, T.receipt); hasReceipt = true; } catch (e) { toast('Foto struk gagal disimpan (memori penuh?). Transaksi tetap disimpan.', 'warn', 4500); hasReceipt = false; } }
      else if (T.removeReceipt) { await Receipts.del(id); hasReceipt = false; }
      rec = put('txs', { id: id, type: T.type, amount: T.amount, categoryId: T.categoryId, walletId: T.walletId, toWalletId: '', fee: 0, date: T.date, note: note, hasReceipt: hasReceipt });
      del('txs', id + '_fee');
    }
    S.db.meta.lastWallet = T.walletId;
    commit(); closeSheet();
    const warn = budgetWarning(rec);
    toast((isNew ? 'Tersimpan ✓' : 'Perubahan disimpan ✓') + (warn ? ' ' + warn : ''), warn ? 'warn' : 'success', warn ? 4500 : 2200);
  } finally { busy(btn, false); }
}
function budgetWarning(t) {
  if (!t || t.type !== 'expense') return '';
  const mr = monthRange(0, t.date); const msgs = [];
  [live('budgets', 'b_' + t.categoryId), live('budgets', 'b___all')].forEach(b => {
    if (!b || !b.limit) return; const p = spentIn(b.categoryId, mr) / b.limit; const nm = b.categoryId === '__all' ? 'total' : cat(b.categoryId).name;
    if (p >= 1) msgs.push('⚠️ Budget ' + nm + ' terlampaui (' + Math.round(p * 100) + '%)'); else if (p >= 0.8) msgs.push('⚠️ Budget ' + nm + ' sudah ' + Math.round(p * 100) + '%');
  });
  return msgs.join(' · ');
}

function compressImage(file, maxSide, quality) {
  maxSide = maxSide || 1100; quality = quality || 0.72;
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = () => { let w = img.naturalWidth, h = img.naturalHeight; const s = Math.min(1, maxSide / Math.max(w, h)); w = Math.max(1, Math.round(w * s)); h = Math.max(1, Math.round(h * s));
      const c = document.createElement('canvas'); c.width = w; c.height = h; const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h); ctx.drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url); resolve(c.toDataURL('image/jpeg', quality)); };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Gambar tidak bisa dibaca')); };
    img.src = url;
  });
}

function advanceDate(r, d) {
  if (r.freq === 'daily') return addDays(d, 1);
  if (r.freq === 'weekly') return addDays(d, 7);
  if (r.freq === 'yearly') return addMonthsClamp(d, 12, r.anchorDay);
  return addMonthsClamp(d, 1, r.anchorDay);
}
function processRecurring(silent) {

    if (!r.active || !isYmd(r.nextDate) || r.nextDate > t) return;
    let next = r.nextDate, guard = 0;
    while (next <= t && guard < 400) {
      const id = 'r_' + r.id + '_' + next;
      if (!byId('txs', id) && live('wallets', r.walletId)) { put('txs', { id: id, type: r.type, amount: r.amount, categoryId: r.categoryId, walletId: r.walletId, date: next, note: r.note || '', recurringId: r.id }); created++; }

  return created;
}

const INCOME_HINT = ['terima', 'dapat', 'dapet', 'masuk', 'cair', 'refund', 'dibayar'];
function parseQuick(text) {
  const raw = String(text || '').trim(); const t = raw.toLowerCase(); const out = { note: raw };
  const re = /(?:rp\.?\s*)?(\d{1,3}(?:[.,]\d{3})+|\d+(?:[.,]\d+)?)\s*(juta|jt|ribu|rb|k|perak)?(?![a-z])/g; let m, best = null;
  while ((m = re.exec(t))) {
    let numStr = m[1], unit = m[2] || '', v;
    const thousands = /^\d{1,3}([.,]\d{3})+$/.test(numStr);
    if (unit && !thousands) v = parseFloat(numStr.replace(',', '.')); else v = parseFloat(numStr.replace(/[.,]/g, ''));
    if (unit === 'juta' || unit === 'jt') v *= 1e6; else if (unit === 'ribu' || unit === 'rb' || unit === 'k') v *= 1e3;
    else if (v < 1000) v *= 1000;
    const cand = { v: Math.round(v), unit: !!unit, idx: m.index, len: m[0].length };
    if (!best || (cand.unit && !best.unit) || (cand.unit === best.unit && cand.v > best.v)) best = cand;
  }
  if (best) { out.amount = best.v; out.note = (raw.slice(0, best.idx) + raw.slice(best.idx + best.len)).replace(/\s+/g, ' ').trim(); }
  let catId = ''; let type = 'expense';
  const custom = all('categories').filter(c => c.id.indexOf('c_') === 0 && t.indexOf(c.name.toLowerCase()) >= 0)[0];
  const learned = custom ? null : learnedCat(raw);
  if (custom) { catId = custom.id; type = custom.type; }
  else if (learned && !INCOME_HINT.some(w => t.indexOf(w) >= 0 && learned.type === 'expense')) { catId = learned.id; type = learned.type; }
  else for (const [id, words] of KW) { if (words.some(w => new RegExp('(^|\\W)' + w.replace(/ /g, '\\s+') + '(\\W|$)').test(t)) && live('categories', id)) { catId = id; type = id.indexOf('i_') === 0 ? 'income' : 'expense'; break; } }
  if (!catId && INCOME_HINT.some(w => t.indexOf(w) >= 0)) { type = 'income'; catId = live('categories', 'i_lain') ? 'i_lain' : ''; }
  out.type = type; if (catId) out.categoryId = catId;
  const ws = wallets(); let wid = (ws.find(w => t.indexOf(w.name.toLowerCase()) >= 0) || {}).id;
  if (!wid) { const kinds = [['cash', ['tunai', 'cash', 'cas']], ['ewallet', ['gopay', 'ovo', 'dana', 'shopeepay', 'linkaja', 'e-wallet', 'ewallet', 'qris']], ['bank', ['bca', 'bri', 'bni', 'mandiri', 'bsi', 'btn', 'bank', 'atm', 'rekening', 'transfer']]];
    for (const [k, words] of kinds) { const hit = words.find(w => t.indexOf(w) >= 0); if (hit) { wid = (ws.find(w => w.kind === k) || {}).id; if (wid) { out.note = out.note.replace(new RegExp('\\b' + hit + '\\b', 'i'), ''); break; } } } }
  else { const wn = ws.find(w => w.id === wid).name; out.note = out.note.replace(new RegExp(wn.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'i'), ''); }
  if (wid) out.walletId = wid;
  if (/\bkemarin\b/.test(t)) out.date = addDays(today(), -1);
  out.note = out.note.replace(/\b(kemarin|tadi|hari ini|pakai|pake|via)\b/gi, '').replace(/\s+/g, ' ').trim().slice(0, 120);
  if (out.note) out.note = out.note.charAt(0).toUpperCase() + out.note.slice(1);
  return out;
}
function quickParse(form) {
  const q = form.q.value.trim(); if (!q) return toast('Ketik dulu, mis. "makan siang 25rb"', 'warn');
  const p = parseQuick(q); form.q.value = '';

const STOPWORDS = ['dan', 'yang', 'buat', 'untuk', 'beli', 'bayar', 'pakai', 'pake', 'via', 'kemarin', 'tadi', 'hari', 'ini', 'dari', 'ke', 'di', 'sama', 'dengan', 'the', 'rp', 'rb', 'ribu', 'jt', 'juta', 'biaya'];
function words(s) { return String(s || '').toLowerCase().replace(/[^a-z0-9\s]/g, ' ').split(/\s+/).filter(w => w.length >= 3 && !/^\d+$/.test(w) && STOPWORDS.indexOf(w) < 0); }
let learnCache = null, learnStamp = '';
function learnModel() {
  const stamp = S.db.txs.length + ':' + (S.db.txs.length ? S.db.txs[S.db.txs.length - 1].updatedAt : 0);
  if (learnCache && learnStamp === stamp) return learnCache;
  const m = {}; let n = 0;
  for (let i = S.db.txs.length - 1; i >= 0 && n < 800; i--) {
    const t = S.db.txs[i]; if (t.deleted || (t.type !== 'expense' && t.type !== 'income') || !t.note || t.transferId || t.recurringId) continue; n++;
    if (!live('categories', t.categoryId)) continue;
    words(t.note).forEach(w => { const e = m[w] = m[w] || {}; e[t.categoryId] = (e[t.categoryId] || 0) + 1; });
  }
  learnCache = m; learnStamp = stamp; return m;
}
/* kategori yang paling sering dipakai untuk kata-kata ini (minimal 2 kali, dominan) */
function learnedCat(text) {
  const m = learnModel(); const score = {};
  words(text).forEach(w => { const e = m[w]; if (!e) return; const tot = sum(Object.keys(e), k => e[k]); Object.keys(e).forEach(k => { if (e[k] >= 2 && e[k] / tot >= 0.6) score[k] = (score[k] || 0) + e[k]; }); });
  const best = Object.keys(score).sort((a, b) => score[b] - score[a])[0];
  return best ? cat(best) : null;
}

/* ---------------- streak mencatat ---------------- */
function logStreak() {
  const days = {}; S.db.txs.forEach(t => { if (!t.deleted && !t.recurringId) days[t.date] = 1; });
  let d = today(); if (!days[d]) d = addDays(d, -1); let n = 0;
  while (days[d] && n < 999) { n++; d = addDays(d, -1); }
  return n;
}

/* ---------------- cicilan / paylater ---------------- */
function isInst(d) { return !!(d && d.installment && d.installment.tenor > 0 && d.installment.monthly > 0); }
function instInfo(d) {
  const i = d.installment; const paid = debtPaid(d.id);
  const idx = Math.min(i.tenor, Math.floor((paid + 1) / i.monthly));
  const done = paid >= d.amount || idx >= i.tenor;
  return { idx: idx, tenor: i.tenor, monthly: i.monthly, next: done ? '' : addMonthsClamp(i.firstDue, idx, parseYmd(i.firstDue).getDate()), done: done };
}
function debtNextDue(d) { if (isInst(d)) return instInfo(d).next; return d.dueDate || ''; }
function monthlyInstallments() { return sum(all('debts').filter(d => isInst(d) && d.kind === 'hutang' && !instInfo(d).done), d => d.installment.monthly); }
function avgMonthlyIncome() { let s = 0; for (let i = -3; i <= -1; i++) { const mr = monthRange(i); s += sum(S.db.txs.filter(t => !t.deleted && t.type === 'income' && inRange(t, mr)), t => +t.amount); } return s / 3; }
function avgMonthlyExpense() { let s = 0; for (let i = -3; i <= -1; i++) s += spentIn('__all', monthRange(i)); return s / 3; }

/* ---------------- langganan ---------------- */
function perMonth(r) { return r.freq === 'monthly' ? r.amount : r.freq === 'weekly' ? r.amount * 4.33 : r.freq === 'daily' ? r.amount * 30.4 : r.amount / 12; }
function subsSummary() { const subs = all('recurring').filter(r => r.isSub && r.active && r.type === 'expense'); const m = sum(subs, perMonth); return { n: subs.length, month: m, year: m * 12 }; }

/* ---------------- prediksi saldo akhir bulan ---------------- */
function recurringBetween(start, end) {
  let tot = 0;
  all('recurring').forEach(r => {
    if (!r.active || r.type !== 'expense' || !isYmd(r.nextDate)) return;
    let d = r.nextDate, g = 0; while (d <= end && g < 400) { if (d >= start) tot += r.amount; d = advanceDate(r, d); g++; }
  });
  all('debts').forEach(d => { if (isInst(d) && d.kind === 'hutang') { const i = instInfo(d); if (!i.done && i.next >= start && i.next <= end) tot += Math.min(i.monthly, debtInfo(d).remain); } });
  return tot;
}
function forecast() {
  const mr = monthRange(0); const t = today(); const passed = dayDiff(mr.start, t) + 1; const left = dayDiff(t, mr.end);
  const list = S.db.txs.filter(x => !x.deleted && x.type === 'expense' && inRange(x, { start: mr.start, end: t }));
  if (list.length < 3 || passed < 3) return null;
  const amounts = list.filter(x => !x.recurringId).map(x => +x.amount).sort((a, b) => a - b);
  const cap = amounts.length >= 6 ? amounts[Math.floor(amounts.length * 0.9)] * 3 : Infinity;   /* abaikan belanja besar sekali-sekali */
  const daily = sum(amounts.filter(a => a <= cap)) / passed;
  const upcoming = recurringBetween(addDays(t, 1), mr.end);
  const bal = totalBalance(); const end = bal - daily * left - upcoming;
  let runOut = '';
  if (end < 0 && daily > 0) { const d = Math.max(0, Math.floor((bal - upcoming) / daily)); runOut = d < left ? addDays(t, d) : mr.end; }
  return { daily: daily, upcoming: upcoming, end: end, runOut: runOut, left: left, mr: mr };
}

/* ---------------- deteksi pengeluaran tidak biasa ---------------- */
function anomalies() {
  const t = today(); const out = [];
  const wk = { start: addDays(t, -6), end: t }; const base = { start: addDays(t, -34), end: addDays(t, -7) };
  const cur = {}, prev = {};
  S.db.txs.forEach(x => { if (x.deleted || x.type !== 'expense' || x.recurringId) return; if (inRange(x, wk)) cur[x.categoryId] = (cur[x.categoryId] || 0) + +x.amount; else if (inRange(x, base)) prev[x.categoryId] = (prev[x.categoryId] || 0) + +x.amount; });
  Object.keys(cur).forEach(k => { const avg = (prev[k] || 0) / 4; if (avg > 0 && cur[k] >= avg * 1.8 && cur[k] - avg >= 20000) out.push({ cat: k, cur: cur[k], avg: avg, x: cur[k] / avg }); });
  return out.sort((a, b) => b.x - a.x).slice(0, 2);
}

function canvasBlob(cv) { return new Promise(res => { try { cv.toBlob(b => res(b), 'image/png'); } catch (e) { res(null); } }); }
async function shareImage(cv, name, text) {
  const blob = await canvasBlob(cv); if (!blob) return toast('Gagal membuat gambar', 'error');
  const file = new File([blob], name, { type: 'image/png' });
  try { if (!APP.preview && navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], text: text || '' }); return; } }
  catch (e) { if (e && e.name === 'AbortError') return; }
  const url = cv.toDataURL('image/png');
  const s = openSheet({ title: 'Simpan & bagikan', body: '<img class="receipt-img" src="' + url + '" alt="Gambar untuk dibagikan"><p class="hint">Tekan lama gambar untuk menyimpan, lalu bagikan ke story / WhatsApp.</p>',
    foot: APP.preview ? '' : '<button type="button" class="btn pri" data-x="dl">⬇ Unduh gambar</button>' });
  const b = $('[data-x=dl]', s.el); if (b) b.onclick = () => downloadBlob(blob, name);
}
function cvCard(w, h) {
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h; const x = cv.getContext('2d');
  const g = x.createLinearGradient(0, 0, w, h); g.addColorStop(0, '#312E81'); g.addColorStop(0.55, '#6D28D9'); g.addColorStop(1, '#0F766E');
  x.fillStyle = g; x.fillRect(0, 0, w, h);
  x.fillStyle = 'rgba(255,255,255,.08)'; x.beginPath(); x.arc(w * 0.9, h * 0.08, w * 0.35, 0, 7); x.fill(); x.beginPath(); x.arc(w * 0.05, h * 0.92, w * 0.3, 0, 7); x.fill();
  return { cv: cv, x: x };
}
const CV_FONT = '"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif';
function cvText(x, txt, X, Y, size, weight, color, align, maxW) {
  x.font = (weight || 700) + ' ' + size + 'px ' + CV_FONT; x.fillStyle = color || '#fff'; x.textAlign = align || 'left'; x.textBaseline = 'alphabetic';
  if (!maxW) { x.fillText(txt, X, Y); return Y; }
  const ws = String(txt).split(' '); let line = '', y = Y;
  ws.forEach((w, i) => { const test = line ? line + ' ' + w : w; if (x.measureText(test).width > maxW && line) { x.fillText(line, X, y); line = w; y += size * 1.25; } else line = test; if (i === ws.length - 1) x.fillText(line, X, y); });
  return y;
}
function cvBrand(x, w, h) { cvText(x, 'FinFlow', w / 2, h - 70, 40, 800, 'rgba(255,255,255,.95)', 'center'); cvText(x, 'catatan keuangan mahasiswa', w / 2, h - 30, 26, 500, 'rgba(255,255,255,.7)', 'center'); }

const CH = {

function chEval(c) {
  const t = today(); const end = addDays(c.start, c.days - 1); const marks = []; let failed = false;
  for (let i = 0; i < c.days; i++) {
    const d = addDays(c.start, i); if (d > t) { marks.push('f'); continue; }
    const txs = S.db.txs.filter(x => !x.deleted && x.date === d);
    let ok;
    if (c.type === 'nocat') ok = !txs.some(x => x.type === 'expense' && x.categoryId === c.catId);
    else if (c.type === 'cap') ok = sum(txs.filter(x => x.type === 'expense'), x => +x.amount) <= c.amount;
    else if (c.type === 'log') ok = txs.some(x => !x.recurringId);
    else ok = sum(txs.filter(x => x.type === 'saving' && x.amount > 0), x => +x.amount) >= c.amount;
    const pending = d === t && !ok && (c.type === 'log' || c.type === 'save');
    marks.push(ok ? 'y' : pending ? 'p' : 'n'); if (!ok && !pending) failed = true;
  }
  const okDays = marks.filter(m => m === 'y').length;
  const status = failed ? 'fail' : (t > end || (t === end && marks[marks.length - 1] === 'y' && (c.type === 'log' || c.type === 'save'))) ? 'win' : 'run';
  return { marks: marks, okDays: okDays, status: status, end: end };
}

/* ====================== SCAN STRUK (OCR) ====================== */
let ocrWorker = null;
function parseAmountText(s) {
  let t = String(s).replace(/[^0-9.,]/g, ''); if (!t) return 0;
  const m = /^(.*?)[.,](\d{2})$/.exec(t);
  if (m && (/[.,]\d{3}$/.test(m[1]) || /^\d{4,}$/.test(m[1]))) t = m[1];
  return parseInt(t.replace(/[.,]/g, ''), 10) || 0;
}
function parseReceiptText(text) {
  const lines = String(text || '').split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  const amtRe = /(\d{1,3}(?:[.,]\d{3})+(?:[.,]\d{2})?|\d{4,9}(?:[.,]\d{2})?)/g;
  const lineAmts = l => (l.match(amtRe) || []).map(parseAmountText).filter(v => v >= 500 && v < 100000000);
  const bad = /sub\s*-?\s*total|total\s*(item|qty|disc|hemat)|diskon|disc|hemat|ppn|pajak|tax|kembali|change|tunai|cash|debit|kartu|card|qris|bayar\s*tunai|point|poin/i;
  const ranks = [/grand\s*total/i, /total\s*(bayar|belanja|tagihan|harga|pembayaran)/i, /\btotal\b/i, /jumlah|tagihan|amount\s*due|netto|harga\s*jual/i];
  let amount = 0;
  for (const re of ranks) { for (const l of lines) { if (re.test(l) && !bad.test(l.replace(re, ''))) { const a = lineAmts(l); if (a.length) { amount = a[a.length - 1]; break; } } } if (amount) break; }
  if (!amount) { const all2 = []; lines.forEach(l => { if (!bad.test(l)) all2.push(...lineAmts(l)); }); amount = all2.length ? Math.max(...all2) : 0; }
  let date = '';
  for (const l of lines) { const m = /(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/.exec(l); if (m) { let y = Number(m[3]); if (y < 100) y += 2000; const d = y + '-' + pad2(Number(m[2])) + '-' + pad2(Number(m[1])); if (isYmd(d) && d <= today() && y > 2015) { date = d; break; } } }

function parseCsv(text) {

  for (let i = 0; i < text.length; i++) { const ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += ch; }
    else if (ch === '"') q = true; else if (ch === delim) { row.push(cur); cur = ''; } else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(cur); if (row.some(c => c.trim())) rows.push(row); row = []; cur = ''; } else cur += ch; }

}

      setSheetBody(s, '<div class="center"><div style="font-size:64px">' + (score >= 7 ? '🏆' : score >= 5 ? '🎉' : '📚') + '</div><div class="xb" style="font-size:26px">Skor ' + score + '/' + QUIZ.length + '</div><p class="muted">' + (score >= 7 ? 'Keren! Literasi keuanganmu sudah bagus.' : score >= 5 ? 'Lumayan! Sedikit lagi jadi jago.' : 'Tidak apa-apa, sekarang kamu tahu lebih banyak.') + '</p><p class="small muted">Skor terbaikmu: ' + best + '/' + QUIZ.length + '</p></div>');

      $('[data-x=again]', s.el).onclick = () => { i = 0; score = 0; answered = -1; draw(); }; $('[data-x=close]', s.el).onclick = () => closeSheet(); return;
    }

      q[1].map((o, j) => '<button type="button" class="quiz-opt' + (answered >= 0 ? (j === q[2] ? ' right' : j === answered ? ' wrong' : '') : '') + '" data-j="' + j + '"' + (answered >= 0 ? ' disabled' : '') + '>' + esc(o) + '</button>').join('') + '</div>' +
      (answered >= 0 ? '<p class="small mt12 ' + (answered === q[2] ? 'green' : 'red') + ' b">' + (answered === q[2] ? 'Benar!' : 'Kurang tepat.') + '</p><p class="small muted">' + esc(q[3]) + '</p>' : ''));

}

/* ====================== BAGIKAN KE FINFLOW ======================
   Dari aplikasi e-wallet/bank: Bagikan › FinFlow. Service worker menyimpan
   teks/gambar yang dibagikan, lalu membuka aplikasi dengan ?aksi=bagikan. */
function parseShared(text) {
  const raw = String(text || '').replace(/\s+/g, ' ').trim(); const out = { amount: 0, note: '', type: 'expense' };
  if (!raw) return out;
  const re = /(?:rp\.?|idr)\s*([\d.,]*\d)/gi; let m; const c = [];
  while ((m = re.exec(raw))) {
    const v = parseAmountText(m[1]); if (!(v >= 100 && v < 1e9)) continue;
    const before = raw.slice(Math.max(0, m.index - 26), m.index);
    c.push({ v: v, key: /(total|jumlah|nominal|sebesar|senilai|amount)\W{0,12}$/i.test(before), bad: /(saldo|sisa|admin|biaya|fee|cashback|diskon|potongan|limit|poin)\W{0,14}$/i.test(before) });
  }
  const pick = c.find(x => x.key && !x.bad) || c.find(x => !x.bad) || c[0];
  const q = parseQuick(raw);
  if (pick) out.amount = pick.v; else if (raw.length <= 80 && q.amount) out.amount = q.amount;
  const inc = /(menerima|diterima|uang masuk|dana masuk|transfer masuk|kamu dapat|received|refund|pengembalian dana)/i.test(raw) && !/(pembayaran|membayar|pembelian|transfer ke|kirim ke|dikirim ke)/i.test(raw);
  out.type = inc ? 'income' : (pick ? 'expense' : q.type || 'expense');
  if (q.categoryId) { const cat = live('categories', q.categoryId); if (cat && cat.type === out.type) out.categoryId = q.categoryId; }

  if (IS_IOS) return openSheet({ title: 'Pasang di iPhone / iPad', body: '<ol class="small" style="padding-left:18px;margin:0;line-height:1.7"><li>Buka halaman ini di <b>Safari</b>.</li><li>Ketuk tombol <b>Bagikan</b> (kotak dengan panah ke atas).</li><li>Pilih <b>Tambah ke Layar Utama</b>, lalu <b>Tambah</b>.</li></ol><p class="hint">Ikon FinFlow muncul di layar utama dan bisa dibuka tanpa internet.</p>' });
  toast('Buka menu ⋮ di Chrome, lalu pilih "Instal aplikasi" atau "Tambahkan ke layar utama".', 'warn', 5000);
}
function handleShortcut() {
  if (S.shortcutDone) return; S.shortcutDone = true; let a = '', shared = null;
  try { const sp = new URLSearchParams(location.search); a = sp.get('aksi') || '';
    if (a === 'bagikan' && (sp.get('text') || sp.get('title') || sp.get('url'))) shared = { meta: { title: sp.get('title') || '', text: sp.get('text') || '', url: sp.get('url') || '', at: Date.now() }, file: null };
  } catch (e) {}
  const map = { keluar: 'expense', masuk: 'income', transfer: 'transfer' };
  if (a) { try { history.replaceState(null, '', location.pathname); } catch (e) {} }
  if (map[a]) setTimeout(() => openTxSheet({ type: map[a] }), 150);
  else if (a === 'patungan') setTimeout(() => editSplit(), 150);
  else if (a === 'scan') setTimeout(() => scanReceipt(), 150);
  else if (a === 'bagikan') setTimeout(() => handleShared(shared), 150);
}

/* ====================== MULAI ====================== */
function boot() {
  applyTheme(); setupPwa();
  try { migrateLegacy(); } catch (e) { console.warn(e); }
  const sess = LS.get('ff6_session'); const users = getUsers();
  /* sesi demo tidak pernah diingat: buka ulang aplikasi = kembali ke layar masuk */
  if (sess === 'demo' && !APP.preview) { LS.del('ff6_session'); clearDemo(); showAuth('login'); return; }
  if (sess && users[sess]) { const u = users[sess]; if (sess !== 'demo' && u.lockOnOpen !== false && u.pinNumeric) showLock(sess); else startSession(sess); }
  else if (APP.preview) ACT.startDemo();
  else showAuth('login');
}
boot();
</script>
