<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1A3358">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FinFlow">
<meta name="description" content="Catatan keuangan pribadi untuk mahasiswa dan keluarga: pemasukan, pengeluaran, budget, target tabungan, utang-piutang. Bisa dipakai offline.">
<title>FinFlow</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='112' fill='%231A3358'/%3E%3Cg fill='white'%3E%3Crect x='160' y='96' width='60' height='232' rx='4'/%3E%3Crect x='160' y='96' width='192' height='60' rx='4'/%3E%3Crect x='160' y='200' width='152' height='56' rx='4'/%3E%3Crect x='160' y='360' width='192' height='20' rx='3'/%3E%3Crect x='160' y='396' width='192' height='20' rx='3'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preload" href="fonts/plex-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/plex-600.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:'IBM Plex Sans';src:url('fonts/plex-400.woff2') format('woff2');font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:'IBM Plex Sans';src:url('fonts/plex-500.woff2') format('woff2');font-weight:500;font-style:normal;font-display:swap}
@font-face{font-family:'IBM Plex Sans';src:url('fonts/plex-600.woff2') format('woff2');font-weight:600;font-style:normal;font-display:swap}

/* ---------- warna: terang ---------- */
:root,:root[data-ff="light"]{
  --bg:#F6F6F3; --card:#FFFFFF; --card2:#ECEDEA; --fill2:#D9DCD6;
  --text:#151C27; --muted:#575F6B; --line:#DDE0DB; --line2:#C0C5BF; --edge:#878D95;
  --pri:#1A3358; --pri-dim:#11223B; --pri-soft:#E2E8F1; --pri-text:#1A3358; --on-pri:#FFFFFF;
  --hd:#1A3358; --on-hd:#FFFFFF; --on-hd2:#BCC8DB; --hd-line:rgba(255,255,255,.18); --hd-fill:rgba(255,255,255,.12);
  --green:#1B7548; --green-soft:#E1F0E6; --red:#A33F2D; --red-soft:#F6E6E2; --amber:#875500; --amber-soft:#FAEFD7;
  --scrim:rgba(12,17,26,.5); --toast:#151C27;
  --nav-h:68px; --r:10px; --r-lg:12px;
  color-scheme:light;
}
/* ---------- warna: gelap ---------- */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]):not([data-ff="light"]){
  --bg:#0F141B; --card:#171D26; --card2:#212834; --fill2:#2E3643;
  --text:#E6E9EE; --muted:#A1A9B5; --line:#2A313C; --line2:#3B4451; --edge:#7A8390;
  --pri:#A9C0E3; --pri-dim:#C2D3EC; --pri-soft:#22324B; --pri-text:#B4C8E8; --on-pri:#0F1A2B;
  --hd:#172238; --on-hd:#FFFFFF; --on-hd2:#AEBBD0; --hd-line:rgba(255,255,255,.14); --hd-fill:rgba(255,255,255,.1);
  --green:#78C597; --green-soft:#16281E; --red:#EC9583; --red-soft:#33201C; --amber:#E2B65E; --amber-soft:#2E2512;
  --scrim:rgba(0,0,0,.6); --toast:#2B3442;
  color-scheme:dark;
  }
}
:root[data-theme="dark"]:not([data-ff="light"]),:root[data-ff="dark"]{
  --bg:#0F141B; --card:#171D26; --card2:#212834; --fill2:#2E3643;
  --text:#E6E9EE; --muted:#A1A9B5; --line:#2A313C; --line2:#3B4451; --edge:#7A8390;
  --pri:#A9C0E3; --pri-dim:#C2D3EC; --pri-soft:#22324B; --pri-text:#B4C8E8; --on-pri:#0F1A2B;
  --hd:#172238; --on-hd:#FFFFFF; --on-hd2:#AEBBD0; --hd-line:rgba(255,255,255,.14); --hd-fill:rgba(255,255,255,.1);
  --green:#78C597; --green-soft:#16281E; --red:#EC9583; --red-soft:#33201C; --amber:#E2B65E; --amber-soft:#2E2512;
  --scrim:rgba(0,0,0,.6); --toast:#2B3442;
  color-scheme:dark;
}

/* ---------- dasar ---------- */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow-x:hidden;min-height:100vh;text-rendering:optimizeLegibility}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;text-align:inherit}
button:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{font:inherit;color:inherit}
a{color:var(--pri-text)}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.hidden{display:none!important}
.muted{color:var(--muted)}
.small{font-size:14px;line-height:1.4}
.tiny{font-size:12px;line-height:1.35}
.b{font-weight:600}
.xb{font-weight:600}
.green{color:var(--green)} .red{color:var(--red)} .amber{color:var(--amber)} .pri{color:var(--pri-text)}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrap-row{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stack>*+*{margin-top:14px}
.ellipsis{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.center{text-align:center}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}
.mv{font-variant-numeric:tabular-nums}
.ic{width:20px;height:20px;fill:currentColor;flex:none;display:inline-block;vertical-align:-4px}
.ic.s16{width:16px;height:16px;vertical-align:-3px}.ic.s18{width:18px;height:18px}.ic.s22{width:22px;height:22px}.ic.s24{width:24px;height:24px;vertical-align:-6px}.ic.s28{width:28px;height:28px}.ic.s32{width:32px;height:32px}
h1,h2,h3{font-weight:600}

/* ---------- kerangka ---------- */
.wrap{max-width:480px;margin:0 auto;padding:4px 20px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom))}
.top{max-width:480px;margin:0 auto;padding:calc(10px + env(safe-area-inset-top)) 20px 8px;display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:58px}
.top-t{font-size:21px;line-height:1.25;font-weight:600}
.hello{font-size:18px;font-weight:600;line-height:1.3}
.top-actions{display:flex;gap:10px;align-items:center}
.icon-btn{width:40px;height:40px;border-radius:20px;background:var(--card2);display:inline-flex;align-items:center;justify-content:center;position:relative;color:var(--text);flex:none}
.icon-btn svg,.icon-btn .ic{width:20px;height:20px}
.avatar{width:40px;height:40px;border-radius:20px;background:var(--pri);color:var(--on-pri);font-weight:600;display:inline-flex;align-items:center;justify-content:center;font-size:16px;flex:none}
.sync-dot{position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--muted);border:2px solid var(--card2)}
[data-sync=ok] .sync-dot{background:var(--green)}
[data-sync=pending] .sync-dot{background:var(--amber)}
[data-sync=error] .sync-dot{background:var(--red)}
[data-sync=syncing] svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.banner{max-width:480px;margin:0 auto;padding:12px 20px 0}
.banner>div{background:var(--amber-soft);color:var(--text);border-radius:var(--r-lg);padding:12px 14px;font-size:14px;line-height:1.4;display:flex;flex-wrap:wrap;gap:10px 12px;align-items:center;justify-content:space-between}
.banner>div>span:first-child{flex:1 1 200px}
.banner>div>span{min-width:0}

/* ---------- header beranda ---------- */
body.on-home .top{display:none}
.hd{background:var(--hd);color:var(--on-hd);margin:-4px -20px 0;padding:calc(10px + env(safe-area-inset-top)) 20px 20px}
.hd .top-row{display:flex;align-items:center;gap:10px;min-height:48px}
.hd .greet{font-size:14px;color:var(--on-hd2)}
.hd .hello{color:var(--on-hd)}
.hd .icon-btn{background:var(--hd-fill);color:var(--on-hd)}
.hd .sync-dot{border-color:var(--hd)}
.hd .avatar{background:var(--on-hd);color:var(--hd)}
.hd .bal{margin-top:18px}
.hd .bal-l{font-size:14px;color:var(--on-hd2)}
.hd .bal-v{display:inline-flex;align-items:baseline;gap:4px;margin-top:4px;padding-bottom:6px;border-bottom:3px double rgba(255,255,255,.5);white-space:nowrap;max-width:100%}
.hd .bal-v .rp{font-size:21px;font-weight:500}
.hd .bal-v .n{font-size:36px;line-height:1.1;font-weight:600;letter-spacing:-.01em;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis}
.hd .bal-v.neg .n{color:#F2B8AC}
.hd .io{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin-top:12px}
.hd .io>div{padding-left:12px;border-left:1px solid var(--hd-line);min-width:0}
.hd .io>div:first-child{padding-left:0;border-left:0}
.hd .io .t{font-size:14px;color:var(--on-hd2)}
.hd .io .v{font-size:16px;font-weight:500;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
body.hide-money .hd .bal-v{border-bottom-color:transparent}

/* ---------- periode ---------- */
.per{display:flex;align-items:center;gap:2px;margin:6px 0 4px}
.per .pb{width:40px;height:40px;border-radius:20px;display:flex;align-items:center;justify-content:center;color:inherit;flex:none}
.per .pl{font-size:16px;font-weight:500;padding:0 4px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.per .pk{margin-left:auto;height:36px;padding:0 10px 0 12px;border-radius:8px;background:var(--card2);display:flex;align-items:center;gap:4px;font-size:14px;font-weight:500;flex:none}
.per .dates{display:flex;gap:6px;flex:1;min-width:0}
.per .dates input{flex:1;min-width:0;height:36px;padding:0 8px;border-radius:8px;border:1px solid var(--edge);background:var(--card);font-size:14px}
.hd .per{margin:14px 0 0 -10px}
.hd .per .pk{background:var(--hd-fill);color:var(--on-hd)}
.hd .per .dates input{background:var(--hd-fill);border-color:var(--hd-line);color:var(--on-hd);color-scheme:dark}
.period{margin:0 0 16px}

/* ---------- kartu & bagian ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px}
.card+.card,.card+.sec,.sec+.card{margin-top:12px}
.sec{margin-top:28px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 0 6px}
.sec-h h2{font-size:18px;line-height:1.3;margin:0;font-weight:600}
.card h2{font-size:18px;line-height:1.3;font-weight:600}
.sec-h .link{font-size:14px}
.link{color:var(--pri-text);font-weight:500;font-size:14px}
.soft-box{background:var(--card2);border-radius:var(--r-lg);padding:16px}
.wallets{display:flex;flex-direction:column}
.wcard{display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.wcard:first-child{border-top:0}
.wcard .n{flex:1;min-width:0;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wcard .v{font-weight:500;font-size:16px;font-variant-numeric:tabular-nums;white-space:nowrap}
.qa{height:72px;border-radius:var(--r-lg);background:var(--card2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:14px;font-weight:500;text-align:center}
.qa .ic{width:22px;height:22px}
.quick{display:flex;align-items:center;gap:4px;height:52px;border:1px solid var(--edge);border-radius:var(--r-lg);background:var(--card);padding:0 6px 0 14px}
.quick input{flex:1;min-width:0;height:48px;border:0;background:transparent;font-size:16px;outline:none;padding:0}
.quick .mic{width:40px;height:40px;display:flex;align-items:center;justify-content:center;color:var(--muted);border-radius:20px}

/* ---------- isian ---------- */
.field{display:block}
.field>span,.lbl2{display:block;font-size:14px;line-height:1.4;font-weight:500;color:var(--text);margin:0 0 6px}
.input,select.input,textarea.input{width:100%;padding:11px 14px;border-radius:var(--r);border:1px solid var(--edge);background:var(--card);font-size:16px;outline:none;min-height:48px}
textarea.input{line-height:1.45}
.input::placeholder,.quick input::placeholder,.amount-box input::placeholder{color:var(--muted);opacity:1}
.input:focus{border-color:var(--pri);box-shadow:0 0 0 1px var(--pri)}
.amount-box{display:flex;align-items:baseline;gap:6px;border-bottom:2px solid var(--pri);padding:2px 0 6px}
.amount-box span{font-weight:500;color:var(--muted);font-size:21px}
.amount-box input{flex:1;min-width:0;border:0;background:transparent;font-size:36px;line-height:1.2;font-weight:600;outline:none;padding:0;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.hint{font-size:14px;line-height:1.4;color:var(--muted);margin-top:8px}
.hint .warn,.hint.warn{color:var(--amber);font-weight:500}
.hint .bad,.hint.bad{color:var(--red);font-weight:500}
.check{display:flex;align-items:center;gap:10px;font-size:16px}
.check input{width:20px;height:20px;accent-color:var(--pri)}

/* ---------- tombol ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:var(--r);font-weight:500;font-size:16px;line-height:1.3;background:var(--card);color:var(--text);border:1px solid var(--line2);text-decoration:none;text-align:center}
.btn.pri{background:var(--pri);color:var(--on-pri);border-color:var(--pri)}
.btn.pri:active{background:var(--pri-dim);border-color:var(--pri-dim)}
.btn.danger{background:var(--card);color:var(--red);border-color:var(--red)}
.btn.soft{background:var(--card2);color:var(--text);border-color:transparent}
.btn.green{background:var(--green);color:#fff;border-color:var(--green)}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px;border-radius:8px;gap:6px}
.btn.block{width:100%}
.btn .ic{width:20px;height:20px}.btn.sm .ic{width:18px;height:18px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;border-radius:8px;background:var(--card);border:1px solid var(--line2);font-weight:500;font-size:14px;white-space:nowrap;color:var(--text)}
.chip .ic{width:18px;height:18px}
.chip.on{background:var(--pri-soft);color:var(--pri-text);border-color:var(--pri);font-weight:600}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.scroll::-webkit-scrollbar{display:none}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:3px;padding:3px;background:var(--card2);border-radius:var(--r)}
.seg button{min-height:38px;padding:0 6px;border-radius:8px;font-weight:500;font-size:14px;color:var(--muted);text-align:center}
.seg button.on{background:var(--card);color:var(--text);font-weight:600;box-shadow:0 0 0 1px var(--line)}

/* ---------- kategori & pilihan ikon ---------- */
.cat-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px 6px}
.cat-btn{display:flex;flex-direction:column;align-items:center;gap:6px;padding:6px 2px;border-radius:var(--r);font-size:12px;line-height:1.3;text-align:center;color:var(--text)}
.cat-btn .e{width:44px;height:44px;border-radius:22px;background:var(--card2);display:flex;align-items:center;justify-content:center}
.cat-btn .e .ic{width:22px;height:22px}
.cat-btn.on{font-weight:600}
.cat-btn.on .e{background:var(--pri);color:var(--on-pri)}
.cat-btn.new .e{background:transparent;border:1px solid var(--line2);color:var(--muted)}
.emoji-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.emoji-grid button{height:48px;border-radius:var(--r);border:1px solid transparent;display:flex;align-items:center;justify-content:center;background:var(--card2)}
.emoji-grid button .ic{width:22px;height:22px}
.emoji-grid button.on{border-color:var(--pri);background:var(--pri-soft);color:var(--pri-text)}

/* ---------- daftar ---------- */
.tx{display:flex;align-items:center;gap:12px;width:100%;text-align:left;min-height:60px;padding:10px 0}
.tx+.tx{border-top:1px solid var(--line)}
.tx-ic{width:40px;height:40px;flex:0 0 40px;border-radius:20px;background:var(--card2);color:var(--text);display:flex;align-items:center;justify-content:center}
.tx-ic .ic{width:20px;height:20px}
.tx-main{flex:1;min-width:0;display:flex;flex-direction:column}
.tx-title{font-size:16px;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px}
.tx-title .t{overflow:hidden;text-overflow:ellipsis}
.tx-title .ic{width:16px;height:16px;color:var(--muted)}
.tx-sub{font-size:14px;line-height:1.4;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-amt{font-weight:500;font-size:16px;white-space:nowrap;font-variant-numeric:tabular-nums;text-align:right}
.tx-amt.pri,.tx-amt.amber{color:var(--text)}
.list{padding:0}
.day-h{display:flex;justify-content:space-between;gap:10px;font-size:14px;color:var(--muted);padding:16px 0 6px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.day-h+.tx{border-top:0}
.empty{text-align:center;color:var(--muted);padding:24px 8px;font-size:16px;line-height:1.5}
.empty .e{width:48px;height:48px;border-radius:24px;background:var(--card2);color:var(--text);display:flex;align-items:center;justify-content:center;margin:0 auto 12px}
.empty .e .ic{width:24px;height:24px}
.empty .btn{margin-top:14px}
.item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px;border-radius:var(--r-lg);background:var(--card);border:1px solid var(--line)}
.item+.item{margin-top:8px}
.badge{display:inline-flex;align-items:center;height:22px;padding:0 7px;border-radius:6px;font-size:12px;font-weight:600;background:var(--card2);color:var(--text);vertical-align:1px;white-space:nowrap}
.badge.green{background:var(--green-soft);color:var(--green)}
.badge.red{background:var(--red-soft);color:var(--red)}
.badge.amber{background:var(--amber-soft);color:var(--amber)}
.badge.pri{background:var(--pri-soft);color:var(--pri-text)}
.bar{height:6px;border-radius:3px;background:var(--fill2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:3px;background:var(--pri)}
.bar>i.amber{background:var(--amber)}.bar>i.red{background:var(--red)}.bar>i.pri{background:var(--pri)}.bar>i.green{background:var(--green)}
.stat{background:var(--card);border-radius:var(--r-lg);padding:12px 14px;border:1px solid var(--line);min-width:0}
.stat .t{font-size:14px;color:var(--muted)}
.stat .v{font-weight:600;margin-top:2px;font-size:18px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prem{display:inline-flex;align-items:center;height:20px;padding:0 6px;border-radius:5px;background:var(--pri-soft);color:var(--pri-text);font-size:12px;font-weight:600;line-height:1;vertical-align:1px;white-space:nowrap}
.btn .prem,.chip .prem{margin-left:2px}

/* ---------- grafik ---------- */
.donut-wrap{display:flex;justify-content:center;padding:8px 0}
.donut{width:184px;height:184px}
.d-lbl{font-size:10px;fill:var(--muted);font-weight:500}
.d-val{font-size:17px;fill:var(--text);font-weight:600}
.legend-row{display:flex;align-items:center;gap:10px;min-height:48px;padding:8px 0;width:100%;text-align:left;font-variant-numeric:tabular-nums}
.legend-row+.legend-row{border-top:1px solid var(--line)}
.sw{width:12px;height:12px;border-radius:3px;flex:0 0 12px}
.trend{width:100%;height:auto;display:block}
.trend text{font-size:10px;fill:var(--muted);font-weight:500}
.trend .bi{fill:var(--green)}.trend .bo{fill:var(--red)}.trend .gl{stroke:var(--line)}
.insight{display:flex;gap:12px;padding:12px 0;font-size:16px;line-height:1.45}
.insight+.insight{border-top:1px solid var(--line)}
.insight .e{color:var(--muted);padding-top:1px}

/* ---------- navigasi bawah ---------- */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav-in{max-width:480px;margin:0 auto;height:var(--nav-h);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:center}
.nav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;line-height:1.3;font-weight:500;color:var(--muted);padding:6px 0;text-align:center}
.nav button .ic{width:24px;height:24px}
.nav button.on{color:var(--pri-text);font-weight:600}
.nav .fab{color:var(--text)}
.nav .fab .plus{width:48px;height:36px;border-radius:10px;background:var(--pri);color:var(--on-pri);display:flex;align-items:center;justify-content:center}
.nav .fab .plus .ic{width:22px;height:22px}

/* ---------- lembar ---------- */
.sheet-bg{position:fixed;inset:0;z-index:60;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;animation:fade .15s ease}
.sheet{background:var(--card);width:100%;max-width:480px;max-height:92vh;border-radius:16px 16px 0 0;display:flex;flex-direction:column;animation:up .2s ease;padding-bottom:env(safe-area-inset-bottom)}
.sheet::before{content:'';width:36px;height:4px;border-radius:2px;background:var(--line2);margin:8px auto 0;flex:none}
.sheet-bg.dialog{align-items:center;padding:20px}
.sheet-bg.dialog .sheet{border-radius:16px;max-width:360px}
.sheet-bg.dialog .sheet::before{display:none}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px 8px 20px}
.sheet-h h3{margin:0;font-size:21px;line-height:1.25;font-weight:600}
.sheet-b{padding:4px 20px 20px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet-f{padding:12px 20px 16px;border-top:1px solid var(--line);display:flex;gap:8px}
.sheet-f .btn{flex:1}
.x-btn{width:40px;height:40px;border-radius:20px;color:var(--muted);display:flex;align-items:center;justify-content:center;flex:none}
.x-btn .ic{width:22px;height:22px}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (min-width:560px){.sheet-bg{align-items:center;padding:20px}.sheet{border-radius:16px}.sheet::before{display:none}}
@media (prefers-reduced-motion:reduce){.sheet-bg,.sheet,.toast,.shake{animation:none!important;transition:none!important}}

/* ---------- toast ---------- */
.toast{position:fixed;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translate(-50%,-16px);z-index:100;max-width:calc(100% - 32px);width:420px;background:var(--toast);color:#fff;padding:12px 16px;border-radius:var(--r-lg);font-size:14px;line-height:1.4;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.18);opacity:0;pointer-events:none;transition:opacity .2s ease,transform .2s ease;border-left:0}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.error{background:#8E3324}.toast.warn{background:#6B4500}.toast.success{background:#1D4E33}

/* ---------- masuk ---------- */
.screen{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto}
.auth{max-width:420px;margin:0 auto;padding:calc(24px + env(safe-area-inset-top)) 24px 24px;min-height:100%;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:12px;margin-top:8px}
.brand h1{margin:0;font-size:21px;line-height:1.25}
.logo{width:40px;height:40px;border-radius:9px;display:block;flex:none}
.tagline{margin:14px 0 22px;color:var(--muted);font-size:16px;line-height:1.45;max-width:32ch}
.acct{display:flex;align-items:center;gap:12px;width:100%;padding:10px 14px 10px 10px;border:1px solid var(--line2);border-radius:var(--r-lg);background:var(--card);text-align:left}
.acct+.acct{margin-top:8px}
.acct .av{width:40px;height:40px;border-radius:20px;background:var(--pri-soft);color:var(--pri-text);display:flex;align-items:center;justify-content:center;font-weight:600;flex:none}
.acct .t{font-weight:500;line-height:1.3}
.acct .s{font-size:14px;color:var(--muted)}
.acct .bio{color:var(--pri-text)}
.mrow{display:flex;align-items:center;gap:12px;width:100%;padding:12px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);text-align:left;color:var(--muted)}
.mrow .t{color:var(--text)}
.mrow .s{font-size:14px;color:var(--muted)}
.auth-foot{margin-top:auto;padding-top:24px;display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:14px;color:var(--muted)}
.auth-foot a{font-weight:500;text-decoration:none}

/* ---------- kunci ---------- */
#lockScreen{background:var(--hd);color:var(--on-hd)}
.lock{max-width:420px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:calc(16px + env(safe-area-inset-top)) 0 calc(12px + env(safe-area-inset-bottom))}
.lk-brand{display:flex;align-items:center;gap:10px;padding:0 24px;font-weight:600}
.lk-brand .logo{width:28px;height:28px;border-radius:7px}
.lk-hello{display:flex;flex-direction:column;align-items:center;text-align:center;margin-top:min(9vh,64px);padding:0 24px}
.lk-av{width:56px;height:56px;border-radius:28px;background:var(--on-hd);color:var(--hd);display:flex;align-items:center;justify-content:center;font-size:21px;font-weight:600}
.lk-h{font-size:24px;line-height:1.25;font-weight:600;margin:16px 0 0}
.lk-sub{font-size:16px;color:var(--on-hd2);margin:6px 0 0}
.dots{display:flex;gap:16px;justify-content:center;margin:32px 0 0;min-height:14px}
.dots i{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--on-hd2)}
.dots i.f{background:var(--on-hd);border-color:var(--on-hd)}
.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.keypad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));row-gap:6px;padding:0 40px;margin-top:min(5vh,40px)}
.keypad button{height:68px;border-radius:34px;font-size:28px;font-weight:400;color:var(--on-hd);display:flex;align-items:center;justify-content:center;text-align:center}
.keypad button:active{background:var(--hd-fill)}
.keypad button .ic{width:30px;height:30px}
.keypad .blank{visibility:hidden}
.lk-foot{margin-top:auto;display:flex;justify-content:center;padding-top:12px}
.lk-foot button{font-size:14px;font-weight:500;color:var(--on-hd2);padding:12px 16px}
.lk-msg{min-height:20px;margin-top:12px;text-align:center;font-size:14px;color:#F2B8AC}

/* ---------- lain-lain ---------- */
.hide-money .mv{filter:blur(7px);user-select:none}
.receipt-img{width:100%;border-radius:var(--r-lg);border:1px solid var(--line);display:block}
.thumb{width:56px;height:56px;border-radius:var(--r);object-fit:cover;border:1px solid var(--line)}
details.guide{background:var(--card2);border-radius:var(--r-lg);padding:12px 14px}
details.guide summary{font-weight:500;cursor:pointer}
details.guide ol{padding-left:20px;margin:8px 0 0;font-size:14px;line-height:1.5}
details.guide li+li{margin-top:6px}
code{background:var(--card2);padding:1px 5px;border-radius:5px;font-size:14px}
.set-group{background:var(--card);border-radius:var(--r-lg);border:1px solid var(--line);overflow:hidden}
.set-row{display:flex;align-items:center;gap:14px;width:100%;min-height:56px;padding:12px 16px;text-align:left;font-size:16px;line-height:1.35}
.set-row+.set-row{border-top:1px solid var(--line)}
.set-row .e{width:22px;display:flex;justify-content:center;color:var(--muted);flex:none}
.set-row .e .ic{width:22px;height:22px}
.set-row .chev{color:var(--muted);display:flex}
.set-row .tiny{font-size:14px;color:var(--muted)}
.set-title{font-size:14px;font-weight:500;color:var(--muted);margin:24px 2px 8px}
.switch{position:relative;width:48px;height:28px;flex:0 0 48px}
.switch input{opacity:0;width:0;height:0;position:absolute}
.switch i{position:absolute;inset:0;border-radius:14px;background:var(--fill2);transition:.2s}
.switch i:after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch input:checked+i{background:var(--pri)}
.switch input:checked+i:after{transform:translateX(20px);background:var(--card)}
.switch input:focus-visible+i{outline:2px solid var(--pri);outline-offset:2px}
.tools{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0}
.tool{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px;line-height:1.3;text-align:center;color:var(--text);padding:0 2px}
.tool span{width:48px;height:48px;border-radius:24px;background:var(--card2);display:flex;align-items:center;justify-content:center}
.tool span .ic{width:22px;height:22px}
.tip{background:var(--card2);border-color:transparent}
.tour{text-align:center;padding:8px 4px 2px}
.tour-ic{width:64px;height:64px;border-radius:32px;background:var(--pri-soft);color:var(--pri-text);display:flex;align-items:center;justify-content:center;margin:0 auto 16px}
.tour-ic .ic{width:30px;height:30px}
.tour h2{font-size:21px;line-height:1.3;margin:0 0 8px}
.tour p{margin:0 auto;max-width:32ch;line-height:1.5;color:var(--muted)}
.tour-dots{display:flex;gap:6px;justify-content:center;margin-top:20px}
.tour-dots i{width:6px;height:6px;border-radius:3px;background:var(--line2)}
.tour-dots i.on{width:18px;background:var(--pri)}
.opt-card{display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;padding:16px;margin-top:10px;border-radius:var(--r-lg);background:var(--card);border:1px solid var(--line2);line-height:1.45}
.opt-card:active,.opt-card:focus-visible{border-color:var(--pri)}
.opt-card .e{width:40px;height:40px;border-radius:20px;background:var(--card2);display:flex;align-items:center;justify-content:center;flex:none}
.more-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px 6px}
.more-grid .tool{width:auto}
details.faq{border-bottom:1px solid var(--line)}
details.faq:first-of-type{border-top:1px solid var(--line)}
details.faq summary{padding:14px 0;font-weight:500;font-size:16px;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:12px}
details.faq summary::-webkit-details-marker{display:none}
details.faq summary::after{content:'+';color:var(--muted);font-weight:400;font-size:20px;line-height:1}
details.faq[open] summary::after{content:'\2212'}
details.faq p{margin:0;padding:0 0 14px;font-size:14px;line-height:1.55;color:var(--muted)}
@media (max-width:340px){.more-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.tools{grid-template-columns:repeat(4,minmax(0,1fr))}.tools .tool:nth-child(n+5){display:none}}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal-h{font-size:12px;font-weight:500;color:var(--muted);text-align:center;padding-bottom:2px}
.cal-d{aspect-ratio:1/1.05;max-width:100%;border-radius:8px;background:var(--card2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:2px;min-width:0}
.cal-d b{font-size:14px;font-weight:500}
.cal-d span{font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;max-width:100%;font-variant-numeric:tabular-nums}
.cal-d.ok{background:var(--green-soft)}.cal-d.ok span{color:var(--green)}
.cal-d.mid{background:var(--amber-soft)}.cal-d.mid span{color:var(--amber)}
.cal-d.hi{background:var(--red-soft)}.cal-d.hi span{color:var(--red)}
.cal-d.fut{opacity:.4}.cal-d.today{outline:2px solid var(--pri);outline-offset:-2px}
.cal-k{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.cal-k.ok{background:var(--green)}.cal-k.mid{background:var(--amber)}.cal-k.hi{background:var(--red)}
.split-list{display:flex;flex-direction:column;gap:8px}
.split-row{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:var(--r-lg);background:var(--card2)}
.split-row .input.money{width:130px;flex:0 0 130px}
.split-row .x-btn{flex:0 0 40px}
.ch-dots{display:flex;flex-wrap:wrap;gap:4px}
.ch-dots i{width:12px;height:12px;border-radius:3px;background:var(--fill2)}
.ch-dots i.y{background:var(--green)}.ch-dots i.n{background:var(--red)}.ch-dots i.p{background:var(--amber)}
.quiz-opt{display:block;width:100%;text-align:left;padding:14px 16px;border-radius:var(--r-lg);border:1px solid var(--line2);background:var(--card);font-size:16px}
.quiz-opt+.quiz-opt{margin-top:8px}
.quiz-opt.right{border-color:var(--green);background:var(--green-soft);color:var(--green)}
.quiz-opt.wrong{border-color:var(--red);background:var(--red-soft);color:var(--red)}
.quiz-opt:disabled{opacity:1}
.big-ic{width:64px;height:64px;border-radius:32px;background:var(--pri-soft);color:var(--pri-text);display:flex;align-items:center;justify-content:center;margin:0 auto}
.big-ic .ic{width:30px;height:30px}
.feat{display:none}
#printArea{display:none}
@media print{
  body{background:#fff}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block;color:#000;font-family:'IBM Plex Sans',Arial,sans-serif;font-size:11px}
  #printArea table{width:100%;border-collapse:collapse;margin:8px 0 14px}
  #printArea th,#printArea td{border-bottom:1px solid #ccc;padding:5px 6px;text-align:left}
  #printArea th{background:#1A3358;color:#fff}
}

/* ---------- tambahan v6.5 ---------- */
.hd p,.hd h1,.hd h2{margin:0}
.hd .hello{font-size:18px}
.sec-h h2,.card h2{margin:0}
.note{display:flex;gap:12px;align-items:flex-start;padding:16px;border-radius:var(--r-lg);background:var(--card);border:1px solid var(--line);width:100%;text-align:left}
.note.warn{background:var(--amber-soft);border-color:transparent}
.note-ic{width:40px;height:40px;border-radius:20px;background:var(--card2);color:var(--text);display:flex;align-items:center;justify-content:center;flex:none}
.note.warn .note-ic{background:rgba(255,255,255,.55)}
:root[data-ff="dark"] .note.warn .note-ic,:root[data-theme="dark"]:not([data-ff="light"]) .note.warn .note-ic{background:rgba(0,0,0,.25)}
.note-t{font-weight:600;line-height:1.35;margin:0}
.note-s{font-size:14px;line-height:1.4;color:var(--muted);margin:2px 0 0}
.note-a{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none}
.note-a .link{padding:6px 0}
.tx-end{display:flex;flex-direction:column;align-items:flex-end;flex:none;min-width:0;max-width:46%}
.tx-w{font-size:14px;line-height:1.4;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.acct .t,.acct .s,.mrow .t,.mrow .s{display:block}
.form-err:empty{display:none}
.stack-s{display:flex;flex-direction:column;gap:8px;margin-top:20px}
.stack-s .lbl2{margin:0}
.dc{background:var(--card2);border-radius:var(--r-lg);padding:16px}
.dc-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.dc-t{font-size:16px;line-height:1.35;font-weight:600;margin:0}
.dc-v{font-size:24px;line-height:1.2;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.dc-s{font-size:14px;color:var(--muted);margin:2px 0 0}
.dc .bar{margin-top:14px}
.dc-m{display:flex;justify-content:space-between;gap:12px;font-size:14px;margin-top:10px;font-variant-numeric:tabular-nums}
.dc-today{font-size:14px;color:var(--muted);margin:4px 0 0}
.chip.date{padding-right:4px}
.chip.date input{border:0;background:transparent;font:inherit;font-size:14px;color:inherit;height:32px;padding:0 4px;min-width:0;width:128px;outline:none}
.f-l{display:block;font-size:14px;font-weight:500;margin:22px 0 8px}
.f-l:first-child{margin-top:4px}
.sheet .seg+.f-l{margin-top:20px}
.logo .lb{fill:var(--pri)}.logo .lf{fill:var(--on-pri)}
.lk-brand .logo .lb{fill:var(--on-hd)}.lk-brand .logo .lf{fill:var(--hd)}
.keypad .blank{visibility:hidden}
.per.light .pb{color:var(--text)}
.grp+.grp{margin-top:4px}
.big-num{font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.inline-ic{display:inline-flex;align-items:center;gap:6px}

button.note{align-items:center}
.hd{position:relative}
/* pemberitahuan versi baru */
.upd-bar{position:fixed;left:12px;right:12px;bottom:calc(var(--nav-h) + 12px + env(safe-area-inset-bottom));z-index:40;max-width:456px;margin:0 auto;display:flex;align-items:center;gap:8px;padding:8px 6px 8px 16px;border-radius:var(--r-lg);background:var(--hd);color:#fff;font-size:14px;line-height:1.4;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.upd-bar .grow{flex:1}
.upd-bar .btn.sm{flex:none;margin:0;background:#fff;color:#1A3358;border-color:#fff}
.upd-bar .x-btn{color:var(--on-hd2)}
</style>

<script>
'use strict';
/* ====================== LIBRARY (disimpan di aplikasi, cadangan CDN) ====================== */
const LIB_CDN = {
  jspdf: 'https://cdn.jsdelivr.net/npm/jspdf@4.2.1/dist/jspdf.umd.min.js',
  autotable: 'https://cdn.jsdelivr.net/npm/jspdf-autotable@5.0.9/dist/jspdf.plugin.autotable.min.js',
  xlsx: 'https://cdn.jsdelivr.net/npm/write-excel-file@4.1.1/bundle/write-excel-file.min.js'
};
async function loadLib(k) { try { await loadScript(LIB[k]); } catch (e) { if (!LIB_CDN[k]) throw e; await loadScript(LIB_CDN[k]); } }
function exportMenu() {
  const s = openSheet({ title: 'Ekspor transaksi', body: '<p class="hint" style="margin-top:0">Periode dan filter yang sedang dipakai di Riwayat ikut diterapkan.</p><div class="set-group">' +
    [['file-pdf', 'Laporan PDF', 'exportPdf', true], ['file-xls', 'File Excel', 'exportXlsx', true], ['file-csv', 'File CSV', 'exportCsv', false]].map(x => '<button type="button" class="set-row" data-x="' + x[2] + '"><span class="e">' + IC(x[0]) + '</span><span class="grow">' + x[1] + (x[3] ? premTag() : '') + '</span><span class="chev">' + IC('download-simple', 's18') + '</span></button>').join('') + '</div>' });
  $$('[data-x]', s.el).forEach(b => b.onclick = () => { const f = b.dataset.x; closeSheet(); ACT[f](); });
}
async function pdfFont(doc) {
  try {
    for (const w of [['400', 'normal'], ['600', 'bold']]) {
      const r = await fetch('fonts/plex-' + w[0] + '.ttf'); if (!r.ok) throw new Error('font');
      doc.addFileToVFS('plex-' + w[0] + '.ttf', u8ToB64(new Uint8Array(await r.arrayBuffer()))); doc.addFont('plex-' + w[0] + '.ttf', 'Plex', w[1]);
    }
    return 'Plex';
  } catch (e) { return 'helvetica'; }
}

/* ====================== PENYIMPANAN PERMANEN ====================== */
async function askPersist(manual) {
  if (!navigator.storage || !navigator.storage.persist) { if (manual) toast('Browser ini tidak mendukung penyimpanan permanen. Buat backup secara rutin.', 'warn', 5000); return false; }
  try {
    let ok = await navigator.storage.persisted();
    if (!ok) ok = await navigator.storage.persist();
    setGlobal({ persisted: !!ok });
    if (manual) toast(ok ? 'Penyimpanan permanen aktif. Browser tidak akan menghapus data FinFlow sendiri.' : (IS_IOS && !IS_STANDALONE ? 'Pasang FinFlow ke layar utama dulu, lalu coba lagi.' : 'Browser belum mengizinkan. Pasang FinFlow sebagai aplikasi, lalu coba lagi.'), ok ? 'success' : 'warn', 5000);
    if (manual && $('#storageRow')) $('#storageRow').outerHTML = storageRowHtml();
    return !!ok;
  } catch (e) { return false; }
}
function storageRowHtml() {
  const on = !!getGlobal().persisted;
  return '<button type="button" class="set-row" id="storageRow" data-act="askPersist"><span class="e">' + IC('hard-drives') + '</span><span class="grow">Penyimpanan permanen<br><span class="tiny">' + (on ? 'Aktif. Browser tidak akan menghapus data ini sendiri.' : 'Belum aktif. Ketuk untuk meminta izin ke browser.') + '</span></span>' + (on ? '<span class="green">' + IC('check-circle', 's22') + '</span>' : '<span class="chev">' + IC('caret-right', 's18') + '</span>') + '</button>';
}

/* ====================== BACKUP BERKATA SANDI ====================== */
const BK_ITER = 600000;
function u8ToB64(u8) { let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); }
function b64ToU8(b) { const s = atob(b); const u = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return u; }
function canEncrypt() { return !!(window.crypto && crypto.subtle && window.isSecureContext); }
async function bkKey(pw, salt, iter) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: salt, iterations: iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
async function backupObject() {
  const data = {}; COLS.forEach(c => { data[c] = S.db[c]; }); const receipts = {}; let nRec = 0;
  for (const t of S.db.txs) { if (!t.deleted && t.hasReceipt) { try { const d = await Receipts.get(t.id); if (d) { receipts[t.id] = d; nRec++; } } catch (e) {} } }
  return { obj: { app: 'FinFlow', format: 6, version: APP.version, exportedAt: new Date().toISOString(), username: S.user.username, displayName: displayName(), data: data, receipts: receipts }, nRec: nRec };
}
async function encryptBackup(obj, pw) {
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await bkKey(pw, salt, BK_ITER);
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv }, key, new TextEncoder().encode(JSON.stringify(obj))));
  return { app: 'FinFlow', format: 6, encrypted: 1, version: obj.version, exportedAt: obj.exportedAt, username: obj.username, count: (obj.data.txs || []).filter(t => !t.deleted).length,
    enc: { alg: 'AES-GCM', kdf: 'PBKDF2-SHA256', iter: BK_ITER, salt: u8ToB64(salt), iv: u8ToB64(iv) }, data: u8ToB64(ct) };
}
async function decryptBackup(obj, pw) {
  const e = obj.enc || {}; const key = await bkKey(pw, b64ToU8(e.salt), Number(e.iter) || BK_ITER);
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64ToU8(e.iv) }, key, b64ToU8(obj.data));
  return JSON.parse(new TextDecoder().decode(pt));
}
function backupName() { return 'FinFlow_backup_' + S.user.username + '_' + today() + '.json'; }
function afterBackup(msg) { S.db.meta.lastBackupAt = Date.now(); saveDb(); renderAll(); toast(msg, 'success', 5000); }
function openBackup() {
  if (previewBlocked()) return;
  const enc = canEncrypt(); const share = !!(navigator.canShare && window.File);
  const s = openSheet({ title: 'Buat backup', body:
    '<p class="muted" style="margin-top:0">File backup berisi semua transaksi dan foto struk, termasuk nama dan nomor WA di catatan utang dan patungan. Simpan di tempat yang aman.</p>' +
    (enc ? '<label class="check mt16"><input type="checkbox" name="lock" checked> Kunci dengan kata sandi</label><div id="bkPw" class="stack mt12"><label class="field"><span>Kata sandi</span><input class="input" type="password" name="pw" autocomplete="new-password" minlength="6" placeholder="Minimal 6 karakter"></label><label class="field"><span>Ulangi kata sandi</span><input class="input" type="password" name="pw2" autocomplete="new-password"></label><p class="hint" style="margin:0">Kata sandi tidak bisa dipulihkan. Tanpa kata sandi ini, backup tidak bisa dibuka.</p></div>' :
      '<p class="hint">Kunci kata sandi hanya tersedia saat FinFlow dibuka lewat https.</p>') +
    '<p class="hint bad form-err" id="bkErr"></p>',
    foot: (share ? '<button type="button" class="btn" data-x="share">' + IC('share-network') + 'Kirim</button>' : '') + '<button type="button" class="btn pri" data-x="dl">' + IC('download-simple') + 'Unduh file</button>' });
  const lock = $('[name=lock]', s.el);
  if (lock) lock.onchange = () => $('#bkPw', s.el).classList.toggle('hidden', !lock.checked);
  const make = async () => {
    const err = $('#bkErr', s.el); err.textContent = '';
    let pw = '';
    if (lock && lock.checked) {
      pw = $('[name=pw]', s.el).value; const pw2 = $('[name=pw2]', s.el).value;
      if (pw.length < 6) { err.textContent = 'Kata sandi minimal 6 karakter.'; return null; }
      if (pw !== pw2) { err.textContent = 'Kata sandi yang diulang tidak sama.'; return null; }
    }
    const b = await backupObject();
    const out = pw ? await encryptBackup(b.obj, pw) : b.obj;
    return { blob: new Blob([JSON.stringify(out)], { type: 'application/json' }), nRec: b.nRec, locked: !!pw };
  };
  const summary = r => S.db.txs.filter(t => !t.deleted).length + ' transaksi' + (r.nRec ? ' dan ' + r.nRec + ' foto' : '') + (r.locked ? ', terkunci kata sandi' : '');
  $('[data-x=dl]', s.el).onclick = async e => { const btn = e.currentTarget; busy(btn, true, 'Menyiapkan…'); const r = await make(); busy(btn, false); if (!r) return;
    downloadBlob(r.blob, backupName()); closeSheet(); afterBackup('Backup diunduh: ' + summary(r) + '. Simpan juga di Google Drive atau kirim ke WA sendiri.'); };
  const sh = $('[data-x=share]', s.el);
  if (sh) sh.onclick = async e => { const btn = e.currentTarget; busy(btn, true, 'Menyiapkan…'); const r = await make(); busy(btn, false); if (!r) return;
    const file = new File([r.blob], backupName(), { type: 'application/json' });
    try { if (navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: 'Backup FinFlow' }); closeSheet(); afterBackup('Backup dikirim: ' + summary(r) + '.'); return; } }
    catch (x) { if (x && x.name === 'AbortError') return; }
    downloadBlob(r.blob, backupName()); closeSheet(); afterBackup('Backup diunduh: ' + summary(r) + '.'); };
}
function askBackupPassword(obj) {
  return new Promise(resolve => {
    let done = false;
    const s = openSheet({ title: 'Backup terkunci', focus: '[name=pw]', body: '<p class="muted" style="margin-top:0">Backup @' + esc(obj.username || '?') + ' dari ' + esc(obj.exportedAt ? fmtTime(Date.parse(obj.exportedAt)) : '-') + ' dikunci dengan kata sandi.</p><form data-submit="noop"><label class="field"><span>Kata sandi backup</span><input class="input" type="password" name="pw" autocomplete="current-password"></label></form><p class="hint bad form-err" id="pwErr"></p>',

function migrateLegacy() {

  if (!legacy || typeof legacy !== 'object') { LS.set('ff6_migrated', '1'); return; }

  const CMAP = { expense: { 'Makan & Minum': 'e_makan', 'Transportasi': 'e_transport', 'Belanja': 'e_belanja', 'Tagihan & Kuota': 'e_tagihan', 'Kebutuhan Kuliah/Kerja': 'e_kuliah', 'Kos / Rumah': 'e_kos', 'Hiburan': 'e_hiburan', 'Kesehatan': 'e_kesehatan', 'Lainnya': 'e_lain' },

        db.txs.push(t);

/* ---------------- data demo ---------------- */
function seedDemo() {

  const pick = a => a[Math.floor(rnd() * a.length)]; const r1k = (a, b) => Math.round((a + rnd() * (b - a)) / 1000) * 1000;
  put('wallets', { id: 'w_tunai', initial: 150000 }); put('wallets', { id: 'w_bank', name: 'Bank BRI', initial: 1250000 }); put('wallets', { id: 'w_ewallet', name: 'GoPay', initial: 85000 });
  const t0 = today(); const add = o => put('txs', Object.assign({ id: uid('t') }, o));
  for (let m = -2; m <= 0; m++) {
    const mr = monthRange(m); if (mr.start > t0) continue;

function donutSvg(items, total) {
  const R = 54, C = 2 * Math.PI * R; let acc = 0;
  const segs = items.map(it => { const len = total > 0 ? it.v / total * C : 0; const gap = items.length > 1 && len > 4 ? 1.5 : 0;
    const s = '<circle r="' + R + '" cx="70" cy="70" fill="none" stroke="' + it.color + '" stroke-width="18" stroke-dasharray="' + Math.max(0, len - gap).toFixed(2) + ' ' + (C - Math.max(0, len - gap)).toFixed(2) + '" stroke-dashoffset="' + (-acc).toFixed(2) + '" transform="rotate(-90 70 70)"></circle>'; acc += len; return s; }).join('');
  return '<svg viewBox="0 0 140 140" class="donut" role="img" aria-label="Diagram per kategori"><circle r="' + R + '" cx="70" cy="70" fill="none" style="stroke:var(--card2)" stroke-width="18"></circle>' + segs +
    '<text x="70" y="64" text-anchor="middle" class="d-lbl">Total</text><text x="70" y="84" text-anchor="middle" class="d-val mv">' + esc(short(total)) + '</text></svg>';
}
function trendSvg(months) {
  const W = 330, H = 170, top = 18, bottom = 24, n = months.length; const max = Math.max(1, ...months.map(m => Math.max(m.inc, m.exp)));
  const gw = W / n; const bw = Math.min(14, gw / 3); let s = '';
  for (let k = 0; k <= 3; k++) { const y = top + (H - top - bottom) * k / 3; s += '<line class="gl" x1="0" x2="' + W + '" y1="' + y + '" y2="' + y + '" stroke-width="1"></line>'; }
  months.forEach((m, i) => {
    const x = i * gw + gw / 2; const sc = v => (H - top - bottom) * v / max;
    const hi = sc(m.inc), he = sc(m.exp); const base = H - bottom;
    s += '<rect class="bi" x="' + (x - bw - 2) + '" y="' + (base - hi) + '" width="' + bw + '" height="' + Math.max(hi, 0.5) + '" rx="3"></rect>';
    s += '<rect class="bo" x="' + (x + 2) + '" y="' + (base - he) + '" width="' + bw + '" height="' + Math.max(he, 0.5) + '" rx="3"></rect>';
    s += '<text x="' + x + '" y="' + (H - 7) + '" text-anchor="middle">' + esc(m.label) + '</text>';
    if (m.exp > 0) s += '<text x="' + (x + 2 + bw / 2) + '" y="' + (base - he - 4) + '" text-anchor="middle" class="mv" style="font-size:8.5px">' + esc(short(m.exp)) + '</text>';
  });
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" class="trend" role="img" aria-label="Pemasukan dan pengeluaran 6 bulan terakhir">' + s + '</svg>';
}
function renderStats() {
  const r = periodRange(); const sm = summarize(r); const type = S.ui.statsType; const map = type === 'income' ? sm.byInc : sm.byExp; const total = type === 'income' ? sm.inc : sm.exp;
  let h = periodBar();
  const days = Math.max(1, dayDiff(r.start, r.end < today() ? r.end : today()) + 1);
  const avgDays = S.ui.period.kind === 'all' ? Math.max(1, sm.list.length ? dayDiff(sortTx(sm.list).slice(-1)[0].date, today()) + 1 : 1) : days;
  h += '<div class="grid2"><div class="stat"><div class="t">Pemasukan</div><div class="v green">' + mv(sm.inc) + '</div></div><div class="stat"><div class="t">Pengeluaran</div><div class="v red">' + mv(sm.exp) + '</div></div>' +
    '<div class="stat"><div class="t">Selisih</div><div class="v ' + (sm.inc - sm.exp < 0 ? 'red' : '') + '">' + mv(sm.inc - sm.exp) + '</div></div><div class="stat"><div class="t">Keluar per hari</div><div class="v">' + mv(sm.exp / avgDays) + '</div></div></div>';

  const items = Object.keys(map).map(k => ({ id: k, v: map[k] })).sort((a, b) => b.v - a.v);

function compressImage(file, maxSide, quality) {
  maxSide = maxSide || 1100; quality = quality || 0.72;
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = () => { let w = img.naturalWidth, h = img.naturalHeight; const s = Math.min(1, maxSide / Math.max(w, h)); w = Math.max(1, Math.round(w * s)); h = Math.max(1, Math.round(h * s));
      const c = document.createElement('canvas'); c.width = w; c.height = h; const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h); ctx.drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url); resolve(c.toDataURL('image/jpeg', quality)); };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Gambar tidak bisa dibaca')); };
    img.src = url;
  });
}

const INCOME_HINT = ['terima', 'dapat', 'dapet', 'masuk', 'cair', 'refund', 'dibayar'];
function parseQuick(text) {
  const raw = String(text || '').trim(); const t = raw.toLowerCase(); const out = { note: raw };
  const re = /(?:rp\.?\s*)?(\d{1,3}(?:[.,]\d{3})+|\d+(?:[.,]\d+)?)\s*(juta|jt|ribu|rb|k|perak)?(?![a-z])/g; let m, best = null;
  while ((m = re.exec(t))) {
    let numStr = m[1], unit = m[2] || '', v;
    const thousands = /^\d{1,3}([.,]\d{3})+$/.test(numStr);
    if (unit && !thousands) v = parseFloat(numStr.replace(',', '.')); else v = parseFloat(numStr.replace(/[.,]/g, ''));
    if (unit === 'juta' || unit === 'jt') v *= 1e6; else if (unit === 'ribu' || unit === 'rb' || unit === 'k') v *= 1e3;
    else if (v < 1000) v *= 1000;

    if (!best || (cand.unit && !best.unit) || (cand.unit === best.unit && cand.v > best.v)) best = cand;
  }
  if (best) { out.amount = best.v; out.note = (raw.slice(0, best.idx) + raw.slice(best.idx + best.len)).replace(/\s+/g, ' ').trim(); }
  let catId = ''; let type = 'expense';
  const custom = all('categories').filter(c => c.id.indexOf('c_') === 0 && t.indexOf(c.name.toLowerCase()) >= 0)[0];
  const learned = custom ? null : learnedCat(raw);
  if (custom) { catId = custom.id; type = custom.type; }
  else if (learned && !INCOME_HINT.some(w => t.indexOf(w) >= 0 && learned.type === 'expense')) { catId = learned.id; type = learned.type; }
  else for (const [id, words] of KW) { if (words.some(w => new RegExp('(^|\\W)' + w.replace(/ /g, '\\s+') + '(\\W|$)').test(t)) && live('categories', id)) { catId = id; type = id.indexOf('i_') === 0 ? 'income' : 'expense'; break; } }
  if (!catId && INCOME_HINT.some(w => t.indexOf(w) >= 0)) { type = 'income'; catId = live('categories', 'i_lain') ? 'i_lain' : ''; }
  out.type = type; if (catId) out.categoryId = catId;
  const ws = wallets(); let wid = (ws.find(w => t.indexOf(w.name.toLowerCase()) >= 0) || {}).id;
  if (!wid) { const kinds = [['cash', ['tunai', 'cash', 'cas']], ['ewallet', ['gopay', 'ovo', 'dana', 'shopeepay', 'linkaja', 'e-wallet', 'ewallet', 'qris']], ['bank', ['bca', 'bri', 'bni', 'mandiri', 'bsi', 'btn', 'bank', 'atm', 'rekening', 'transfer']]];
    for (const [k, words] of kinds) { const hit = words.find(w => t.indexOf(w) >= 0); if (hit) { wid = (ws.find(w => w.kind === k) || {}).id; if (wid) { out.note = out.note.replace(new RegExp('\\b' + hit + '\\b', 'i'), ''); break; } } } }
  else { const wn = ws.find(w => w.id === wid).name; out.note = out.note.replace(new RegExp(wn.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'i'), ''); }
  if (wid) out.walletId = wid;
  if (/\bkemarin\b/.test(t)) out.date = addDays(today(), -1);
  out.note = out.note.replace(/\b(kemarin|tadi|hari ini|pakai|pake|via)\b/gi, '').replace(/\s+/g, ' ').trim().slice(0, 120);
  if (out.note) out.note = out.note.charAt(0).toUpperCase() + out.note.slice(1);
  return out;
}

/* ---------------- kategori yang belajar dari kebiasaan ---------------- */
const STOPWORDS = ['dan', 'yang', 'buat', 'untuk', 'beli', 'bayar', 'pakai', 'pake', 'via', 'kemarin', 'tadi', 'hari', 'ini', 'dari', 'ke', 'di', 'sama', 'dengan', 'the', 'rp', 'rb', 'ribu', 'jt', 'juta', 'biaya'];
function words(s) { return String(s || '').toLowerCase().replace(/[^a-z0-9\s]/g, ' ').split(/\s+/).filter(w => w.length >= 3 && !/^\d+$/.test(w) && STOPWORDS.indexOf(w) < 0); }
let learnCache = null, learnStamp = '';
function learnModel() {
  const stamp = S.db.txs.length + ':' + (S.db.txs.length ? S.db.txs[S.db.txs.length - 1].updatedAt : 0);
  if (learnCache && learnStamp === stamp) return learnCache;
  const m = {}; let n = 0;
  for (let i = S.db.txs.length - 1; i >= 0 && n < 800; i--) {
    const t = S.db.txs[i]; if (t.deleted || (t.type !== 'expense' && t.type !== 'income') || !t.note || t.transferId || t.recurringId) continue; n++;
    if (!live('categories', t.categoryId)) continue;
    words(t.note).forEach(w => { const e = m[w] = m[w] || {}; e[t.categoryId] = (e[t.categoryId] || 0) + 1; });
  }
  learnCache = m; learnStamp = stamp; return m;
}
/* kategori yang paling sering dipakai untuk kata-kata ini (minimal 2 kali, dominan) */
function learnedCat(text) {
  const m = learnModel(); const score = {};
  words(text).forEach(w => { const e = m[w]; if (!e) return; const tot = sum(Object.keys(e), k => e[k]); Object.keys(e).forEach(k => { if (e[k] >= 2 && e[k] / tot >= 0.6) score[k] = (score[k] || 0) + e[k]; }); });
  const best = Object.keys(score).sort((a, b) => score[b] - score[a])[0];
  return best ? cat(best) : null;
}

/* ---------------- streak mencatat ---------------- */
function logStreak() {
  const days = {}; S.db.txs.forEach(t => { if (!t.deleted && !t.recurringId) days[t.date] = 1; });
  let d = today(); if (!days[d]) d = addDays(d, -1); let n = 0;

}

/* ---------------- cicilan / paylater ---------------- */
function isInst(d) { return !!(d && d.installment && d.installment.tenor > 0 && d.installment.monthly > 0); }
function instInfo(d) {
  const i = d.installment; const paid = debtPaid(d.id);
  const idx = Math.min(i.tenor, Math.floor((paid + 1) / i.monthly));
  const done = paid >= d.amount || idx >= i.tenor;
  return { idx: idx, tenor: i.tenor, monthly: i.monthly, next: done ? '' : addMonthsClamp(i.firstDue, idx, parseYmd(i.firstDue).getDate()), done: done };
}
function debtNextDue(d) { if (isInst(d)) return instInfo(d).next; return d.dueDate || ''; }
function monthlyInstallments() { return sum(all('debts').filter(d => isInst(d) && d.kind === 'hutang' && !instInfo(d).done), d => d.installment.monthly); }
function avgMonthlyIncome() { let s = 0; for (let i = -3; i <= -1; i++) { const mr = monthRange(i); s += sum(S.db.txs.filter(t => !t.deleted && t.type === 'income' && inRange(t, mr)), t => +t.amount); } return s / 3; }
function avgMonthlyExpense() { let s = 0; for (let i = -3; i <= -1; i++) s += spentIn('__all', monthRange(i)); return s / 3; }

/* ---------------- langganan ---------------- */
function perMonth(r) { return r.freq === 'monthly' ? r.amount : r.freq === 'weekly' ? r.amount * 4.33 : r.freq === 'daily' ? r.amount * 30.4 : r.amount / 12; }
function subsSummary() { const subs = all('recurring').filter(r => r.isSub && r.active && r.type === 'expense'); const m = sum(subs, perMonth); return { n: subs.length, month: m, year: m * 12 }; }

/* ---------------- prediksi saldo akhir bulan ---------------- */
function recurringBetween(start, end) {
  let tot = 0;
  all('recurring').forEach(r => {
    if (!r.active || r.type !== 'expense' || !isYmd(r.nextDate)) return;
    let d = r.nextDate, g = 0; while (d <= end && g < 400) { if (d >= start) tot += r.amount; d = advanceDate(r, d); g++; }
  });
  all('debts').forEach(d => { if (isInst(d) && d.kind === 'hutang') { const i = instInfo(d); if (!i.done && i.next >= start && i.next <= end) tot += Math.min(i.monthly, debtInfo(d).remain); } });
  return tot;
}
function forecast() {
  const mr = monthRange(0); const t = today(); const passed = dayDiff(mr.start, t) + 1; const left = dayDiff(t, mr.end);
  const list = S.db.txs.filter(x => !x.deleted && x.type === 'expense' && inRange(x, { start: mr.start, end: t }));
  if (list.length < 3 || passed < 3) return null;
  const amounts = list.filter(x => !x.recurringId).map(x => +x.amount).sort((a, b) => a - b);
  const cap = amounts.length >= 6 ? amounts[Math.floor(amounts.length * 0.9)] * 3 : Infinity;   /* abaikan belanja besar sekali-sekali */
  const daily = sum(amounts.filter(a => a <= cap)) / passed;
  const upcoming = recurringBetween(addDays(t, 1), mr.end);
  const bal = totalBalance(); const end = bal - daily * left - upcoming;
  let runOut = '';
  if (end < 0 && daily > 0) { const d = Math.max(0, Math.floor((bal - upcoming) / daily)); runOut = d < left ? addDays(t, d) : mr.end; }
  return { daily: daily, upcoming: upcoming, end: end, runOut: runOut, left: left, mr: mr };
}

function anomalies() {
  const t = today(); const out = [];
  const wk = { start: addDays(t, -6), end: t }; const base = { start: addDays(t, -34), end: addDays(t, -7) };
  const cur = {}, prev = {};
  S.db.txs.forEach(x => { if (x.deleted || x.type !== 'expense' || x.recurringId) return; if (inRange(x, wk)) cur[x.categoryId] = (cur[x.categoryId] || 0) + +x.amount; else if (inRange(x, base)) prev[x.categoryId] = (prev[x.categoryId] || 0) + +x.amount; });
  Object.keys(cur).forEach(k => { const avg = (prev[k] || 0) / 4; if (avg > 0 && cur[k] >= avg * 1.8 && cur[k] - avg >= 20000) out.push({ cat: k, cur: cur[k], avg: avg, x: cur[k] / avg }); });
  return out.sort((a, b) => b.x - a.x).slice(0, 2);
}

function chEval(c) {
  const t = today(); const end = addDays(c.start, c.days - 1); const marks = []; let failed = false;
  for (let i = 0; i < c.days; i++) {
    const d = addDays(c.start, i); if (d > t) { marks.push('f'); continue; }
    const txs = S.db.txs.filter(x => !x.deleted && x.date === d);
    let ok;
    if (c.type === 'nocat') ok = !txs.some(x => x.type === 'expense' && x.categoryId === c.catId);
    else if (c.type === 'cap') ok = sum(txs.filter(x => x.type === 'expense'), x => +x.amount) <= c.amount;
    else if (c.type === 'log') ok = txs.some(x => !x.recurringId);
    else ok = sum(txs.filter(x => x.type === 'saving' && x.amount > 0), x => +x.amount) >= c.amount;
    const pending = d === t && !ok && (c.type === 'log' || c.type === 'save');
    marks.push(ok ? 'y' : pending ? 'p' : 'n'); if (!ok && !pending) failed = true;
  }
  const okDays = marks.filter(m => m === 'y').length;
  const status = failed ? 'fail' : (t > end || (t === end && marks[marks.length - 1] === 'y' && (c.type === 'log' || c.type === 'save'))) ? 'win' : 'run';
  return { marks: marks, okDays: okDays, status: status, end: end };
}

/* ====================== SCAN STRUK (OCR) ====================== */
let ocrWorker = null;
function parseAmountText(s) {

}

  const bad = /sub\s*-?\s*total|total\s*(item|qty|disc|hemat)|diskon|disc|hemat|ppn|pajak|tax|kembali|change|tunai|cash|debit|kartu|card|qris|bayar\s*tunai|point|poin/i;

  for (const re of ranks) { for (const l of lines) { if (re.test(l) && !bad.test(l.replace(re, ''))) { const a = lineAmts(l); if (a.length) { amount = a[a.length - 1]; break; } } } if (amount) break; }
  if (!amount) { const all2 = []; lines.forEach(l => { if (!bad.test(l)) all2.push(...lineAmts(l)); }); amount = all2.length ? Math.max(...all2) : 0; }
  let date = '';
  for (const l of lines) { const m = /(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/.exec(l); if (m) { let y = Number(m[3]); if (y < 100) y += 2000; const d = y + '-' + pad2(Number(m[2])) + '-' + pad2(Number(m[1])); if (isYmd(d) && d <= today() && y > 2015) { date = d; break; } } }
  const known = /(indomaret|alfamart|alfamidi|superindo|hypermart|transmart|lawson|family\s*mart|circle\s*k|kfc|mcdonald|mcd|starbucks|janji\s*jiwa|kopi\s*kenangan|mixue|richeese|hokben|pizza\s*hut|apotek|kimia\s*farma|guardian|watsons|gramedia|pertamina|shell)/i;

  if (!merchant) merchant = (lines.find(l => /[a-z]{3,}/i.test(l) && (l.replace(/[^a-z]/gi, '').length / l.length) > 0.5) || '').slice(0, 40);

}

async function runScan(file) {

  const set = (p, msg) => { const a = $('#ocrPct'), b = $('#ocrBar'), c = $('#ocrMsg'); if (a) a.textContent = Math.round(p * 100) + '%'; if (b) b.style.width = Math.max(2, p * 100) + '%'; if (c && msg) c.textContent = msg; };

}

function parseCsv(text) {

    else if (ch === '"') q = true; else if (ch === delim) { row.push(cur); cur = ''; } else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(cur); if (row.some(c => c.trim())) rows.push(row); row = []; cur = ''; } else cur += ch; }

function b64u(buf) { return btoa(String.fromCharCode.apply(null, new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }
function unb64u(s) { s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; return Uint8Array.from(atob(s), c => c.charCodeAt(0)); }
async function bioAvailable() {
  if (APP.preview || !window.PublicKeyCredential || !window.isSecureContext) return false;
  try { return await window.PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable(); } catch (e) { return false; }
}
function rnd(n) { const a = new Uint8Array(n); crypto.getRandomValues(a); return a; }
async function bioEnable() {
  const u = S.user;
  try {
    const cred = await navigator.credentials.create({ publicKey: { challenge: rnd(32), rp: { name: 'FinFlow' }, user: { id: rnd(16), name: u.username, displayName: displayName() || u.username },
      pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }], authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required', residentKey: 'discouraged' }, timeout: 60000, attestation: 'none' } });
    if (!cred) throw new Error('batal');
    updateLocalUser(u.username, { bio: { id: b64u(cred.rawId) } }); toast(bioWord() === 'Face ID' ? 'Face ID aktif' : 'Sidik jari aktif', 'success'); return true;
  } catch (e) { toast('Gagal mengaktifkan: ' + (e && e.name === 'NotAllowedError' ? 'dibatalkan' : (e.message || e)), 'error'); return false; }
}
async function bioUnlock(auto) {
  const u = lockUser; const rec = getUsers()[u]; if (!rec || !rec.bio) return;
  const msg = $('#lockMsg');
  const wait = lockedFor(u); if (wait) { if (msg) msg.textContent = 'Terlalu banyak percobaan. Coba lagi dalam ' + wait + ' detik.'; return; }
  try {
    const a = await navigator.credentials.get({ publicKey: { challenge: rnd(32), allowCredentials: [{ type: 'public-key', id: unb64u(rec.bio.id) }], userVerification: 'required', timeout: 60000 } });
    if (!a) throw new Error('x'); recordFail(u, true); lockBuf = ''; startSession(u);
  } catch (e) {
    if (e && e.name === 'NotAllowedError') return;
    if (msg && !auto) msg.textContent = (bioWord() === 'Face ID' ? 'Face ID' : 'Sidik jari') + ' tidak dikenali. Masukkan PIN.';
  }
}

/* ====================== BAGIKAN KE FINFLOW ======================
   Dari aplikasi e-wallet/bank: Bagikan › FinFlow. Service worker menyimpan
   teks/gambar yang dibagikan, lalu membuka aplikasi dengan ?aksi=bagikan. */
function parseShared(text) {
  const raw = String(text || '').replace(/\s+/g, ' ').trim(); const out = { amount: 0, note: '', type: 'expense' };
  if (!raw) return out;
  const re = /(?:rp\.?|idr)\s*([\d.,]*\d)/gi; let m; const c = [];
  while ((m = re.exec(raw))) {
    const v = parseAmountText(m[1]); if (!(v >= 100 && v < 1e9)) continue;
    const before = raw.slice(Math.max(0, m.index - 26), m.index);
    c.push({ v: v, key: /(total|jumlah|nominal|sebesar|senilai|amount)\W{0,12}$/i.test(before), bad: /(saldo|sisa|admin|biaya|fee|cashback|diskon|potongan|limit|poin)\W{0,14}$/i.test(before) });
  }
  const pick = c.find(x => x.key && !x.bad) || c.find(x => !x.bad) || c[0];
  const q = parseQuick(raw);
  if (pick) out.amount = pick.v; else if (raw.length <= 80 && q.amount) out.amount = q.amount;
  const inc = /(menerima|diterima|uang masuk|dana masuk|transfer masuk|kamu dapat|received|refund|pengembalian dana)/i.test(raw) && !/(pembayaran|membayar|pembelian|transfer ke|kirim ke|dikirim ke)/i.test(raw);
  out.type = inc ? 'income' : (pick ? 'expense' : q.type || 'expense');
  if (q.categoryId) { const cat = live('categories', q.categoryId); if (cat && cat.type === out.type) out.categoryId = q.categoryId; }
  if (q.walletId) out.walletId = q.walletId;
  const dm = /(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})/.exec(raw);
  if (dm) { const d = dm[3] + '-' + pad2(Number(dm[2])) + '-' + pad2(Number(dm[1])); if (isYmd(d) && d <= today() && d >= addDays(today(), -60)) out.date = d; }
  const mm = /(?:\bke(?:pada)?|\bdi|\bdari|\bto|\bfrom)\s+((?:[A-Z0-9][\w&'.\-]*\s?){1,5})/.exec(raw);
  let note = mm ? mm[1].trim() : (pick ? raw.replace(/(?:rp\.?|idr)\s*[\d.,]*\d/gi, '').replace(/https?:\/\/\S+/g, '') : q.note || raw);
  note = note.replace(/(?:rp\.?|idr)\s*[\d.,]*\d/gi, '').replace(/\s+/g, ' ').replace(/^[\s\-:.,]+|[\s\-:.,]+$/g, '').slice(0, 60);
  out.note = note ? note.charAt(0).toUpperCase() + note.slice(1) : '';
  return out;
}
async function takeShared() {
  if (!('caches' in window)) return null;
  try {
    const c = await caches.open('finflow-share'); const mr = await c.match('./__share/meta'); if (!mr) return null;
    const meta = await mr.json(); const fr = await c.match('./__share/file'); const file = fr ? await fr.blob() : null;
    await c.delete('./__share/meta'); await c.delete('./__share/file');
    if (Date.now() - (meta.at || 0) > 10 * 60000) return null;
    return { meta: meta, file: file };
  } catch (e) { return null; }
}
async function handleShared(given) {
  const sh = given || await takeShared();
  if (!sh) return toast('Tidak ada yang bisa dibaca. Coba bagikan lagi dari aplikasi asalnya.', 'warn', 4500);
  const meta = sh.meta || {}; const text = [meta.title, meta.text, meta.url].filter(Boolean).join(' ');
  const r = parseShared(text); const file = sh.file && /^image\//.test(sh.file.type || '') ? sh.file : null;
  if (file && !r.amount) {
    if (isPremium() && !APP.preview) return runScan(file);
    openTxSheet({ type: 'expense', prefill: { note: r.note || 'Dari bukti pembayaran' } });
    return toast('Isi nominalnya, ya. Membaca isi struk otomatis tersedia di Premium.', 'warn', 5500);
  }
  const prefill = { note: r.note }; if (r.amount) prefill.amount = r.amount; if (r.categoryId) prefill.categoryId = r.categoryId; if (r.walletId) prefill.walletId = r.walletId; if (r.date) prefill.date = r.date;
  if (file && isPremium()) { try { prefill.receipt = await compressImage(file); } catch (e) { /* lampiran dilewati */ } }
  openTxSheet({ type: r.type, prefill: prefill });
  toast(r.amount ? 'Terbaca ' + rp(r.amount) + '. Cek lagi lalu Simpan.' : 'Nominal belum terbaca. Isi manual ya.', r.amount ? 'success' : 'warn', 4500);
}

/* ====================== SINKRON GOOGLE SHEETS ====================== */
function serverOn() { return !APP.preview && (IS_GAS || !!getGlobal().gasUrl) && isPremium(); }
function callServer(req) {
  if (IS_GAS) return new Promise((res, rej) => { google.script.run.withSuccessHandler(res).withFailureHandler(rej).apiHandle(req); });
  const url = getGlobal().gasUrl; if (!url) return Promise.resolve({ success: false, message: 'URL sinkron belum diatur' });
  const ctl = typeof AbortController !== 'undefined' ? new AbortController() : null; const timer = setTimeout(() => { if (ctl) ctl.abort(); }, 30000);
  return fetch(url, { method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(req), signal: ctl ? ctl.signal : undefined })
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .finally(() => clearTimeout(timer));
}

function pendingCount() { if (!S.db) return 0; const lp = S.db.meta.lastPushAt || 0; let n = 0; COLS.forEach(c => S.db[c].forEach(r => { if ((r.updatedAt || 0) > lp) n++; })); return n; }
function setSyncState(st) { syncState = st; updateSyncUI(); }
function updateSyncUI() { const b = $('#syncBtn'); if (b) { b.dataset.sync = syncing ? 'syncing' : (syncState === 'ok' && pendingCount() ? 'pending' : syncState); b.title = lastSyncError || ''; } }
function labelFor(c, r) {
  if (r.deleted) return '(dihapus)';
  try {
    if (c === 'txs') { const v = txView(r); return r.date + ' | ' + ({ expense: 'Keluar', income: 'Masuk', transfer: 'Transfer', saving: 'Tabungan', debt: 'Utang' }[r.type] || r.type) + ' | ' + v.title + ' | ' + rp(Math.abs(r.amount)) + ' | ' + v.sub; }
    if (c === 'wallets') return r.name + ' (saldo awal ' + rp(r.initial || 0) + ')';
    if (c === 'categories') return (r.type === 'income' ? 'Masuk' : 'Keluar') + ': ' + r.name;
    if (c === 'budgets') return 'Budget ' + (r.categoryId === '__all' ? 'total' : cat(r.categoryId).name) + ': ' + rp(r.limit);
    if (c === 'goals') return r.title + ', target ' + rp(r.target);
    if (c === 'debts') return (r.kind === 'piutang' ? 'Piutang ke ' : 'Utang ke ') + r.contact + ' ' + rp(r.amount);
    if (c === 'recurring') return (FREQ[r.freq] || '') + ': ' + (r.note || cat(r.categoryId).name) + ' ' + rp(r.amount);
    if (c === 'prefs') return 'Profil: ' + (r.displayName || '');
    if (c === 'splits') return 'Patungan: ' + r.title + ' ' + rp(r.total);
    if (c === 'wishes') return 'Wishlist: ' + r.name + ' ' + rp(r.price) + ' (' + ({ wait: 'menunggu', skipped: 'tidak jadi', bought: 'dibeli' }[r.status] || r.status) + ')';
    if (c === 'challenges') return 'Tantangan: ' + (CH[r.type] ? CH[r.type].name(r) : r.type);

async function syncNow(manual) {

  if (!serverOn()) { if (manual) toast('Mode offline: data tersimpan di HP ini. Atur di Pengaturan › Sinkron.'); return; }

    COLS.forEach(c => { const arr = db[c].filter(r => (r.updatedAt || 0) > lp); if (arr.length) changes[c] = arr.map(r => Object.assign({}, r, { _s: labelFor(c, r) })); });

async function doBackup() { openBackup(); }
$('#restoreInput').addEventListener('change', async e => {
  const f = e.target.files && e.target.files[0]; e.target.value = ''; if (!f || !S.user) return;
  let obj; try { obj = JSON.parse(await f.text()); } catch (err) { return toast('File bukan backup FinFlow yang valid', 'error'); }
  if (obj && obj.app === 'FinFlow' && obj.encrypted) { if (!canEncrypt()) return toast('Backup terkunci hanya bisa dibuka lewat https.', 'error'); obj = await askBackupPassword(obj); if (!obj) return; }
  if (!obj || obj.app !== 'FinFlow' || !obj.data || typeof obj.data !== 'object') return toast('File bukan backup FinFlow yang valid', 'error');
  const n = Array.isArray(obj.data.txs) ? obj.data.txs.filter(t => t && !t.deleted).length : 0;
  const s = openSheet({ title: 'Pulihkan backup', body: '<p class="muted" style="margin-top:0">Backup @' + esc(obj.username || '?') + ' dari ' + esc(obj.exportedAt ? fmtTime(Date.parse(obj.exportedAt)) : '') + ', ' + n + ' transaksi.</p>' +

    foot: '<button type="button" class="btn danger" data-x="replace">Ganti semua</button><button type="button" class="btn pri" data-x="merge">Gabungkan</button>' });
  const run = async mode => {
    if (mode === 'replace' && !(await confirmBox('Ganti semua data?', 'Data sekarang akan diganti isi backup.', 'Ganti', true))) return;
    const ts = nowTs(); let applied = 0;
    COLS.forEach(c => {
      const incoming = Array.isArray(obj.data[c]) ? obj.data[c].filter(r => r && typeof r.id === 'string') : [];
      const ids = {}; incoming.forEach(r => { ids[r.id] = 1; });
      if (mode === 'replace') S.db[c].forEach(r => { if (!ids[r.id] && !r.deleted && !(c === 'prefs')) { r.deleted = true; r.updatedAt = ts; } });
      incoming.forEach(r => { const list = S.db[c]; const i = list.findIndex(x => x.id === r.id);
        if (r.deleted && mode !== 'replace') return;
        if (mode === 'replace' || i < 0 || list[i].deleted || (r.updatedAt || 0) > (list[i].updatedAt || 0)) { const rec = Object.assign({}, r, { updatedAt: ts }); if (i < 0) list.push(rec); else list[i] = rec; applied++; } });
    });
    const rc = obj.receipts || {}; for (const id of Object.keys(rc)) { try { await Receipts.put(id, rc[id]); } catch (e) {} }
    seedDefaults(); closeAllSheets(); commit(); toast('Backup dipulihkan. ' + applied + ' data diperbarui.', 'success', 3500);
  };
  $('[data-x=merge]', s.el).onclick = () => run('merge'); $('[data-x=replace]', s.el).onclick = () => run('replace');
});
