  doBackup: () => doBackup(), pickRestore: () => $('#restoreInput').click(),
  exportPdf: () => exportPdf(), exportXlsx: () => exportXlsx(), exportCsv: () => exportCsv(),
  installApp: () => installApp(), openPremium: () => openPremium(),
  hideTip: () => { setGlobal({ tipHidden: weekKey() }); renderAll(); }, openQuiz: () => openQuiz(),
  scanReceipt: () => scanReceipt(), newInstallment: () => editDebt(null, { installment: true }),
  openRecap: () => openRecap(), openParentReport: () => openParentReport(), openAllocate: () => { closeAllSheets(); openAllocate(); },
  calDay: el => { S.tab = 'history'; S.ui.period = { kind: 'custom', offset: 0 }; S.ui.cStart = S.ui.cEnd = el.dataset.d; S.ui.hist = Object.assign(S.ui.hist, { type: 'all', cat: '', wallet: '', q: '' }); renderAll(); window.scrollTo(0, 0); },
  editSplit: () => editSplit(), splitDetail: el => splitDetail(el.dataset.id), splitPay: el => debtPay(el.dataset.id),
  editWish: el => editWish(el.dataset.id), wishDecide: el => wishDecide(el.dataset.id, el.dataset.v),
  editChallenge: () => editChallenge(), shareChallenge: el => shareChallenge(el.dataset.id),
  delChallenge: async el => { if (!(await confirmBox('Hapus tantangan?', 'Tantangan ini akan dihapus dari daftar.', 'Hapus', true))) return; del('challenges', el.dataset.id); commit(); },
  openMore: () => openMore(), simpleOff: () => { closeAllSheets(); setSimple(false); toast('Tampilan lengkap aktif. Semua fitur tampil di Beranda.', 'success', 3500); },
  openHelp: () => openHelp(), openTourAgain: () => { closeAllSheets(); openTour(); }, inviteFriend: () => inviteFriend(),
  startTrial: () => { if (!startTrial()) return toast('Uji coba gratis sudah pernah dipakai di HP ini.', 'warn'); closeAllSheets(); renderAll(); toast('Uji coba Premium aktif selama ' + APP.trialDays + ' hari', 'success', 4500); },
  hideTrialOffer: () => { setGlobal({ trialOfferHidden: true }); renderAll(); }, hideTrialEnd: () => { setGlobal({ trialEndHidden: true }); renderAll(); },
  openReminder: () => openReminder(), openImport: () => openImport(), shareBackup: () => shareBackup(), openWage: () => openWage(), bioUnlock: () => bioUnlock()
};
const SUBMIT = { doLogin: doLogin, doRegister: doRegister, quickParse: quickParse, noop: () => {} };
const CHANGE = {
  txDatePick: () => { readTxInputs(); renderTxSheet(); },
  cStart: el => { S.ui.cStart = el.value; renderAll(); }, cEnd: el => { S.ui.cEnd = el.value; renderAll(); },
  histCat: el => { S.ui.hist.cat = el.value; S.ui.hist.limit = 120; $('#histList').innerHTML = histListHtml(); },
  histWallet: el => { S.ui.hist.wallet = el.value; S.ui.hist.limit = 120; $('#histList').innerHTML = histListHtml(); },
  theme: el => { setGlobal({ theme: el.value }); applyTheme(); },
  simple: el => { setSimple(el.checked); toast(el.checked ? 'Tampilan sederhana aktif. Fitur lain ada di "Fitur lainnya".' : 'Tampilan lengkap aktif.', 'success', 3500); },
  hideMoney: el => { setGlobal({ hideMoney: el.checked }); applyTheme(); renderAll(); },
  monthStart: el => { put('prefs', { id: 'profile', monthStartDay: Number(el.value) || 1 }); commit(); toast('Bulan sekarang dimulai tanggal ' + el.value, 'success'); },
  accent: el => { if (!isPremium()) { el.value = 'indigo'; needPremium('Pilihan warna aplikasi adalah fitur Premium.'); return; } setGlobal({ accent: el.value }); applyAccent(); },
  bio: async el => { if (el.checked) { const ok = await bioEnable(); if (!ok) el.checked = false; } else { updateLocalUser(S.user.username, { bio: null }); toast('Buka dengan sidik jari dimatikan', 'success'); } },
  lockOnOpen: el => { updateLocalUser(S.user.username, { lockOnOpen: el.checked }); toast(el.checked ? 'PIN diminta saat membuka aplikasi' : 'Aplikasi langsung terbuka tanpa PIN', 'success'); }
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const fn = ACT[el.dataset.act]; if (!fn) return;
  if (el.tagName === 'A') e.preventDefault();
  try { fn(el, e); } catch (err) { console.error(err); toast('Terjadi kesalahan: ' + err.message, 'error'); }
});
document.addEventListener('submit', e => {
  const f = e.target; if (!f.dataset || !f.dataset.submit) return; e.preventDefault();
  const fn = SUBMIT[f.dataset.submit]; if (fn) Promise.resolve(fn(f, e)).catch(err => { console.error(err); toast('Terjadi kesalahan: ' + err.message, 'error'); });
});
document.addEventListener('change', e => { const el = e.target; if (el.dataset && el.dataset.change && CHANGE[el.dataset.change]) CHANGE[el.dataset.change](el, e); });
let histQTimer = null;
document.addEventListener('input', e => {
  const el = e.target;
  if (el.classList && el.classList.contains('money')) {
    const pos = el.value.length - el.selectionStart; const n = parseAmount(el.value); el.value = n ? fmtNum(n) : '';
    try { const p = Math.max(0, el.value.length - pos); el.setSelectionRange(p, p); } catch (x) {}
    if (TX && txEntry && el.name === 'amount') { TX.amount = n; updateBudgetHint(); }
  }
  if (TX && txEntry && el.name === 'note' && !TX.id && !TX.catTouched && TX.type !== 'transfer' && txEntry.el.contains(el)) {
    const c = learnedCat(el.value); if (c && c.type === TX.type && c.id !== TX.categoryId) { TX.categoryId = c.id; $$('.cat-btn[data-id]', txEntry.el).forEach(b => b.classList.toggle('on', b.dataset.id === c.id)); updateBudgetHint(); }
  }
  if (el.dataset && el.dataset.input === 'histQ') { S.ui.hist.q = el.value; clearTimeout(histQTimer); histQTimer = setTimeout(() => { const b = $('#histList'); if (b) b.innerHTML = histListHtml(); }, 150); }
});
window.addEventListener('pagehide', () => { if (S.user) saveDb(); });
window.addEventListener('error', e => { console.error(e.error || e.message); });


/* ====================== APLIKASI (PWA: bisa dipasang & jalan offline) ====================== */
let installEvt = null;
const IS_STANDALONE = (() => { try { return window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true; } catch (e) { return false; } })();
const IS_IOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const IS_WEB = /^https?:$/.test(location.protocol) && !APP.preview && !IS_GAS;
function setupPwa() {
  if (!IS_WEB) return;
  const add = (rel, href) => { if ($('link[rel="' + rel + '"]')) return; const l = document.createElement('link'); l.rel = rel; l.href = href; document.head.appendChild(l); };
  add('manifest', 'manifest.webmanifest'); add('apple-touch-icon', 'icons/apple-touch-icon.png');
  if ('serviceWorker' in navigator) {
    let hadCtl = !!navigator.serviceWorker.controller, lastCheck = Date.now();
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(reg => {
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState !== 'visible' || Date.now() - lastCheck < 15 * 60 * 1000) return;
        lastCheck = Date.now(); reg.update().catch(() => {});
      });
    }).catch(() => {});
    navigator.serviceWorker.addEventListener('controllerchange', () => { if (!hadCtl) { hadCtl = true; return; } updateReady(); });
  }
}
function updateReady() {
  if (!S.user || $('#app').classList.contains('hidden')) { location.reload(); return; }
  if ($('#updBar')) return;
  const el = document.createElement('div'); el.id = 'updBar'; el.className = 'upd-bar'; el.setAttribute('role', 'status');
  el.innerHTML = '<span class="grow">Versi baru sudah siap.</span><button type="button" class="btn sm" data-x="reload">Muat ulang</button><button type="button" class="x-btn" data-x="later" aria-label="Nanti saja">' + IC('x') + '</button>';
  document.body.appendChild(el);
  el.querySelector('[data-x=reload]').onclick = () => location.reload();
  el.querySelector('[data-x=later]').onclick = () => el.remove();
}
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; updateInstallSlot(); });
window.addEventListener('appinstalled', () => { installEvt = null; updateInstallSlot(); toast('FinFlow sudah terpasang di HP', 'success'); });
function canInstall() { return IS_WEB && !IS_STANDALONE && (!!installEvt || IS_IOS); }
function updateInstallSlot() { const el = $('#installSlot'); if (el) el.innerHTML = canInstall() ? '<button type="button" class="btn block" data-act="installApp">' + IC('download-simple') + 'Pasang FinFlow sebagai aplikasi</button>' : ''; }
async function installApp() {
  if (installEvt) { const ev = installEvt; installEvt = null; ev.prompt(); try { await ev.userChoice; } catch (e) {} updateInstallSlot(); return; }
  if (IS_IOS) return openSheet({ title: 'Pasang di iPhone atau iPad', body: '<ol class="small" style="padding-left:18px;margin:0;line-height:1.7"><li>Buka halaman ini di <b>Safari</b>.</li><li>Ketuk tombol <b>Bagikan</b> (kotak dengan panah ke atas).</li><li>Pilih <b>Tambah ke Layar Utama</b>, lalu <b>Tambah</b>.</li></ol><p class="hint">Ikon FinFlow muncul di layar utama dan bisa dibuka tanpa internet.</p>' });
  toast('Buka menu ⋮ di Chrome, lalu pilih "Instal aplikasi" atau "Tambahkan ke layar utama".', 'warn', 5000);
}
function handleShortcut() {
  if (S.shortcutDone) return; S.shortcutDone = true; let a = '', shared = null;
  try { const sp = new URLSearchParams(location.search); a = sp.get('aksi') || '';
    if (a === 'bagikan' && (sp.get('text') || sp.get('title') || sp.get('url'))) shared = { meta: { title: sp.get('title') || '', text: sp.get('text') || '', url: sp.get('url') || '', at: Date.now() }, file: null };
  } catch (e) {}
  const map = { keluar: 'expense', masuk: 'income', transfer: 'transfer' };
  if (a) { try { history.replaceState(null, '', location.pathname); } catch (e) {} }
  if (map[a]) setTimeout(() => openTxSheet({ type: map[a] }), 150);
  else if (a === 'patungan') setTimeout(() => editSplit(), 150);
  else if (a === 'scan') setTimeout(() => scanReceipt(), 150);
  else if (a === 'bagikan') setTimeout(() => handleShared(shared), 150);
}

/* ====================== MULAI ====================== */
function boot() {
  applyTheme(); setupPwa();
  try { migrateLegacy(); } catch (e) { console.warn(e); }
  const sess = LS.get('ff6_session'); const users = getUsers();
  /* sesi demo tidak pernah diingat: buka ulang aplikasi = kembali ke layar masuk */
  if (sess === 'demo' && !APP.preview) { LS.del('ff6_session'); clearDemo(); showAuth('login'); return; }
  if (sess && users[sess]) { const u = users[sess]; if (sess !== 'demo' && u.lockOnOpen !== false && u.pinNumeric) showLock(sess); else startSession(sess); }
  else if (APP.preview) ACT.startDemo();
  else showAuth('login');
}
boot();
</script>
